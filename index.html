<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amber 视频手册</title>
<link rel="icon" href="logo.svg">
<style>
:root { --bg: #f6f7f9; --card: #fff; --ink: #1f2329; --ink2: #646a73; --line: #e5e6eb; --accent: #d9771c; --accent-soft: #fff3e6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #16171a; --card: #1f2124; --ink: #ebedf0; --ink2: #a0a4ab; --line: #2e3035; --accent: #f0963a; --accent-soft: #33261a; } }
:root[data-theme="dark"] { --bg: #16171a; --card: #1f2124; --ink: #ebedf0; --ink2: #a0a4ab; --line: #2e3035; --accent: #f0963a; --accent-soft: #33261a; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 18px 24px; max-width: 1280px; margin: 0 auto; }
header img { width: 36px; height: 36px; border-radius: 9px; }
header h1 { font-size: 20px; margin: 0; }
header .docs { margin-left: auto; color: var(--accent); text-decoration: none; font-size: 15px; border: 1px solid var(--accent); border-radius: 999px; padding: 6px 14px; } header span { color: var(--ink2); font-size: 14px; }
main { display: grid; grid-template-columns: 1fr 340px; gap: 20px; max-width: 1280px; margin: 0 auto; padding: 0 24px 40px; }
nav { display: flex; flex-direction: column; gap: 8px; }
.ch { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); cursor: pointer; text-align: left; color: inherit; font: inherit; }
.ch img { width: 96px; height: 54px; object-fit: cover; border-radius: 6px; flex: none; background: var(--line); }
.ch b { display: block; font-size: 15px; } .ch small { color: var(--ink2); font-size: 12.5px; }
.ch.on { border-color: var(--accent); background: var(--accent-soft); }
.player { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; align-self: start; }
video { width: 100%; aspect-ratio: 16 / 9; display: block; background: #000; }
.info { padding: 16px 20px 20px; display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
.info h2 { margin: 0 0 6px; font-size: 20px; } .info p { margin: 0; color: var(--ink2); font-size: 14.5px; line-height: 1.6; }
.next { flex: none; border: 1px solid var(--accent); color: var(--accent); background: none; border-radius: 999px; padding: 8px 16px; font: inherit; font-size: 14px; cursor: pointer; }
@media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 0 16px 32px; } header { padding: 16px; } nav { order: 2; } .info { flex-direction: column; } }
</style>
</head>
<body>
<header><img src="logo.svg" alt=""><div><h1>Amber 视频手册</h1><span>按章节观看，每章 1 分钟左右</span></div><a class="docs" href="docs/">文字文档 →</a></header>
<main>
  <section class="player"><video id="v" controls playsinline preload="metadata"></video>
    <div class="info"><div><h2 id="t"></h2><p id="d"></p></div><button class="next" id="n">下一章 →</button></div></section>
  <nav id="list"></nav>
</main>
<script>
const CH = [
  { file: 'ch0', title: 'Amber 是什么', desc: '一次和 AI 助手跑通的操作，存成指令，以后一键执行，结果每次都一样。' },
  { file: 'ch1', title: '第 1 章 · 把一次操作存成指令', desc: '和 AI 助手把事情做成，说一句「存进 Amber」，在认领卡上试运行、提交审核，审核通过后生效。' },
  { file: 'ch2', title: '第 2 章 · 在飞书里执行', desc: '在群里 @Amber 发「帮助」，选指令、填参数、点执行，结果直接显示在卡片上。' },
  { file: 'ch3', title: '第 3 章 · 定时任务', desc: '跟 AI 助手说好时间，在确认卡片上点「创建」，到点结果自动发到群里。' },
  { file: 'ch4', title: '第 4 章 · 网站', desc: '私聊 Amber 发「登录」打开网站：执行指令、查看代码、回看所有执行记录。' },
  { file: 'ch5', title: '第 5 章 · 改版本和下线', desc: '想改指令就跟 AI 助手说，新版本会列出代码差异并重新审核；不需要的指令发「下线」。' },
];
const DUR = {"ch0":25,"ch1":49,"ch2":31,"ch3":19,"ch4":37,"ch5":16};
const v = document.getElementById('v'), list = document.getElementById('list');
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
list.innerHTML = CH.map((c, i) => `<button class="ch" data-i="${i}"><img src="${c.file}.jpg" alt=""><span><b>${c.title}</b><small>${fmt(DUR[c.file] || 0)}</small></span></button>`).join('');
let cur = 0;
function show(i, play) {
  cur = i; const c = CH[i];
  v.src = c.file + '.mp4'; v.poster = c.file + '.jpg';
  document.getElementById('t').textContent = c.title;
  document.getElementById('d').textContent = c.desc;
  document.getElementById('n').style.visibility = i < CH.length - 1 ? 'visible' : 'hidden';
  list.querySelectorAll('.ch').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
  history.replaceState(null, '', '#' + c.file);
  if (play) v.play().catch(() => {});
}
list.addEventListener('click', e => { const b = e.target.closest('.ch'); if (b) show(+b.dataset.i, true); });
document.getElementById('n').onclick = () => show(Math.min(cur + 1, CH.length - 1), true);
v.addEventListener('ended', () => { if (cur < CH.length - 1) document.getElementById('n').focus(); });
const start = CH.findIndex(c => '#' + c.file === location.hash);
show(start < 0 ? 0 : start, false);
</script>
</body>
</html>
