<script>
const DATA = {"md":"# 主要场景的实现方式\n\n每个场景都按同一个顺序讲：**跟 agent 怎么说**、**应用里要声明什么**（这些都写在应用定义里，随代码一起审核）、**用的时候要注意什么**。脚本具体怎么写由 agent 负责，技术细节见[脚本约定](script.md)。\n\n## 1. 查数据出报表（按执行人自己的权限）\n\n> 查一下近 7 天每个城市的注册商户数，做成表格和柱状图。……存进 Amber，叫「注册商户数」，天数做成参数。\n\n- **声明**：调用数据服务 `data-mcp`，并写明每次执行最多调用几次（比如 `calls: 1`）。\n\n  > data-mcp 是企业内部的数仓应用，Amber 把它作为可信服务访问：每次调用都带执行人的身份凭证，数仓按执行人的权限返回数据（见[可信身份](identity.md)）。\n\n- **身份**：每次执行，Amber 给数据服务签发一张代表**执行人本人**的短时效凭证，数据服务按这个人的权限返回数据。同一个应用，不同的人执行，看到的是各自有权限的数据。agent 和脚本都改不了这个身份。\n- **注意**\n  - 声明了数据服务的应用**不能直连网络**，查到的数据只能去往执行位置白名单里的地址（比如写进飞书文档）。\n  - agent 不能直接执行这类应用，总要你本人在确认卡上点一下；**结果只显示在卡片上**，不会交给 agent。\n  - 输出里的表格、图表会显示成飞书表格和图表（卡片里每张表最多 100 行，完整内容在网站上看）。\n  - 试运行最多返回 20 行。\n\n## 2. 定时监控，有异常才提醒\n\n> 每 15 分钟检查一下今天的失败交易数，超过 100 笔就提醒我，正常的时候别发消息。\n\n- **声明**：允许定时执行（默认就是允许的）。\n- **关键写法**：**正常时什么都不输出，有异常才输出**。Amber 的规则是脚本没有输出就不发消息，所以正常时不会打扰任何人。\n- 建好应用后，再对 agent 说「每 15 分钟跑一下」，在确认卡上点「创建定时任务」。\n- **注意**\n  - 定时任务每次都以**创建人**的身份运行，结果发到原来的群或话题。\n  - 失败时只私聊通知创建人；连续失败 3 次自动暂停。\n  - 应用下线、出了新版本（需要你点「换绑」）、创建人退群时，定时任务都会自动暂停。\n\n## 3. 需要外部系统的 token、密码\n\n> 调 GitLab 接口查一下这个仓库昨天有没有新提交。……存进 Amber，GitLab 的 token 做成密钥。\n\n- **声明**：密钥的**名字**（比如 `GITLAB_TOKEN`）。代码里只写名字，从不写值。要访问外部系统的，还要声明「可以访问外网」。\n- **填值**：认领时在认领卡上点「设置密钥」，Amber 私聊你一张卡片填写；以后在网站应用页的「密钥」里改。**不要把 token 发给 agent，也不要贴在群里。**\n- **注意**\n  - 值加密保存，只交给这个应用，设置后谁都看不到原值（只显示末尾 4 位）。\n  - 脚本如果把密钥原样打印出来，结果里会自动遮成 `***`。\n  - 用到密钥的应用，agent 不能直接执行，总要你本人点确认卡。\n  - 应用只有你能执行，所以密钥只有你自己在用；设为全局的应用例外，所有执行人共用一份。\n\n## 4. 访问机器人在本机建的数据（比如台账）\n\n> 读一下你维护的客户台账，列出这周要回访的客户。……存进 Amber。\n\n机器人自己的数据（台账、导出文件等）在它所在的机器上，不在 Amber 那台机器上。做法是：\n\n- **前提**：那台机器上装好了**执行端**，管理员批准了一个**运行环境**。从 botmux 机器人导出的环境，能访问的数据和这个机器人在自己沙箱里能访问的一样。这一步由部署方和管理员完成，见[执行端与运行环境](executor.md)。\n- **声明**：应用写明在哪个环境里运行（`env: \"执行端名/环境名\"`）。代码里**不写任何路径声明**，能访问什么完全由环境决定。agent 用 `amber envs --mine` 找到属于自己的环境。\n- **注意**\n  - 应用在那台机器上、那个环境的沙箱里执行；没有写环境的应用在 Amber 本机跑，看不到任何业务数据。\n  - 这类应用**不能上架到 Store**，也**不能设为全局**；要给同事用，用[复制给群成员](sharing.md#1-复制给同群的人克隆)。\n  - 执行端离线时执行会直接失败，提示执行端不在线。\n\n## 5. 把结果交给群里的机器人或同事\n\n> 每天早上检查一下仓库，有新提交就 @同步机器人 让它拉最新代码；没有就什么都不说。\n\n- **写法**：脚本输出的正文里写 `@名字`，名字要和对方在群里的显示名完全一样，比如 `仓库有 3 个新提交。@同步机器人 请拉取最新代码并重新部署。`\n- **效果**：正式运行时，Amber 发结果卡时把它换成真正的 @。被 @ 的人会收到提醒，被 @ 的机器人（比如 botmux 的机器人）会被唤起，接着处理。\n- **注意**\n  - 不用另外声明；审核时看代码就知道它会 @ 谁。\n  - 只在群里的正式运行生效（手动执行、agent 发起后由人确认的执行、定时任务）；试运行和私聊只显示文字。\n  - 名字后面要空一格，或者接标点、换行：`@张三 请看` 会 @，`@张三请看` 不会。\n  - `@所有人` 不生效；群里有同名的人、对方不在群里时不 @。一次最多 @ 5 个人。表格和图表里的 @ 不生效。\n  - 机器人看到的发送者是 Amber，不是任何人，所以需要人员身份的操作它做不了。要它做的事在正文里写清楚。\n\n## 6. 把结果写进飞书文档\n\n> 把这周的回访名单写进一个飞书文档，发我链接。……存进 Amber。\n\n- **做法**：应用在一个从 botmux 机器人导出的运行环境里运行（见场景 4），脚本里调用 `lark-cli`，用的是**这个机器人的飞书身份**，和它平时在会话里用的一样。\n- **声明**：只要运行环境。飞书的域名默认在所有环境的网络白名单里，lark-cli 会经代理访问飞书，不用声明「可以访问外网」。\n- **注意**\n  - 文档的创建人是那个机器人。机器人建的文档默认只有它自己能看，需要在脚本里把你加成协作者，或者让机器人分享给你。\n  - 可以和数据服务一起用：「用 data-mcp 查数再写进飞书文档」放在同一个应用里就行。数据只能去往白名单里的地址，发不到别处。\n\n## 7. 每次都一样的值\n\n> 检查的仓库地址每次都一样，做成配置项，不要每次让人填。\n\n- **声明**：这个参数标成配置项（`scope: \"config\"`）。\n- **设置**：应用生效后，在网站上这个应用页面底部的「配置项」里设置一次，以后每次执行（包括定时任务）自动带上，执行的人改不了。必填的配置项没设置时不能执行。\n- **注意**：配置项不保密，看得到这个应用的人都能看到值；token、密码要用密钥。试运行时还没有地方保存，配置项在试运行表单里填，只用于这次试运行。\n\n## 8. 给同事用\n\n应用默认只有你自己能看见、能执行。给同事用有四种方式：复制给同群的人、上架到 Amber Store、管理员设为全局、离职交接时管理员重新分配。区别和怎么选见[应用的分享](sharing.md)。\n","nav":[{"name":"quickstart","title":"快速上手","group":"使用手册/业务开发人员","current":false},{"name":"chat","title":"Amber 机器人对话","group":"使用手册/业务开发人员","current":false},{"name":"with-agent","title":"和自己的 agent 协作","group":"使用手册/业务开发人员","current":false},{"name":"web","title":"网站操作","group":"使用手册/业务开发人员","current":false},{"name":"scenarios","title":"主要场景的实现方式","group":"使用手册/业务开发人员","current":true},{"name":"sharing","title":"应用的分享","group":"使用手册/业务开发人员","current":false},{"name":"faq","title":"常见问题","group":"使用手册/业务开发人员","current":false},{"name":"review","title":"审核指南","group":"使用手册/审核人员","current":false},{"name":"admin","title":"管理员手册","group":"使用手册/系统管理员","current":false},{"name":"install","title":"安装与部署","group":"安装运维","current":false},{"name":"feishu-setup","title":"飞书应用配置","group":"安装运维","current":false},{"name":"executor","title":"执行端与运行环境","group":"安装运维","current":false},{"name":"concepts","title":"概念模型","group":"概念模型与开发参考","current":false},{"name":"script","title":"脚本约定","group":"概念模型与开发参考","current":false},{"name":"cli-and-skill","title":"agent 接入：命令行、skill 与接口","group":"概念模型与开发参考","current":false},{"name":"identity","title":"可信身份","group":"概念模型与开发参考","current":false},{"name":"identity-example","title":"可信身份：完整示例","group":"概念模型与开发参考","current":false},{"name":"environment-format","title":"运行环境定义格式","group":"概念模型与开发参考","current":false},{"name":"usage","title":"使用指南（已拆分）","group":"","current":false}]};
const REPO = 'https://github.com/xu4wang/amber/blob/main/';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Same anchor rule as GitHub, so links written for the repo keep working here.
const slug = t => t.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');

const doc = document.getElementById('doc');
doc.innerHTML = DOMPurify.sanitize(marked.parse(DATA.md));
const names = new Set(DATA.nav.map(n => n.name));
doc.querySelectorAll('a[href]').forEach(a => {
  const h = a.getAttribute('href');
  const m = /^([a-z-]+)\.md(#.*)?$/.exec(h);
  if (m && names.has(m[1])) a.setAttribute('href', m[1] + '.html' + (m[2] || ''));
  else if (/^\.\.\//.test(h)) { a.setAttribute('href', REPO + h.replace(/^\.\.\//, '')); a.target = '_blank'; a.rel = 'noopener'; }
  else if (/^https?:/.test(h)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
});
// Diagrams (assets/*.svg) are inlined so they take the page's light / dark colours.
doc.querySelectorAll('img').forEach(async img => {
  if (!/^assets\/[a-z0-9-]+\.svg$/.test(img.getAttribute('src') || '')) return;
  try {
    const r = await fetch(img.src);
    if (!r.ok) return;
    const box = document.createElement('div');
    box.className = 'diagram';
    box.innerHTML = DOMPurify.sanitize(await r.text(), { USE_PROFILES: { svg: true } });
    const svg = box.querySelector('svg');
    if (!svg) return;
    svg.removeAttribute('width'); svg.removeAttribute('height');
    img.replaceWith(box);
  } catch {}
});
const toc = [];
doc.querySelectorAll('h2, h3').forEach(h => { h.id = slug(h.textContent); if (h.tagName === 'H2') toc.push(h); });
if (typeof hljs === 'object') doc.querySelectorAll('pre code').forEach(c => {
  const lang = (c.className.match(/language-(\w+)/) || [])[1];
  if (lang && hljs.getLanguage(lang)) hljs.highlightElement(c);
});

const cur = DATA.nav.find(n => n.current);
// Nav groups are "section/subgroup"; a page without a group stays out of the nav.
// Each section folds. On every load only the section of the current page is open.
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const curSection = cur && cur.group ? cur.group.split('/')[0] : null;
let navHtml = '', lastSection = null, lastSub = null;
for (const n of DATA.nav) {
  if (!n.group) continue;
  const [section, sub] = n.group.split('/');
  if (section !== lastSection) {
    if (lastSection !== null) navHtml += '</details>';
    const open = section === curSection;
    navHtml += `<details class="sec" data-sec="${esc(section)}"${open ? ' open' : ''}><summary>${esc(section)}</summary>`;
    lastSection = section; lastSub = null;
  }
  if (sub && sub !== lastSub) { navHtml += `<div class="group">${esc(sub)}</div>`; lastSub = sub; }
  navHtml += link(n);
}
if (lastSection !== null) navHtml += '</details>';
const nav = document.getElementById('nav');
nav.innerHTML = navHtml;

// The whole menu: hidden or shown on a wide screen (remembered), opened on demand on a phone.
const btn = document.getElementById('navbtn');
const phone = matchMedia('(max-width: 860px)');
if (store.get('amber-docs-nav-hidden')) document.body.classList.add('nav-hidden');
const shown = () => phone.matches ? document.body.classList.contains('nav-open') : !document.body.classList.contains('nav-hidden');
const sync = () => btn.setAttribute('aria-expanded', String(shown()));
btn.addEventListener('click', () => {
  if (phone.matches) document.body.classList.toggle('nav-open');
  else { document.body.classList.toggle('nav-hidden'); store.set('amber-docs-nav-hidden', document.body.classList.contains('nav-hidden')); }
  sync();
});
phone.addEventListener('change', sync);
nav.addEventListener('click', e => { if (phone.matches && e.target.closest('a')) document.body.classList.remove('nav-open'); });
sync();
function link(n) {
  const a = `<a href="${esc(n.name)}.html" class="${n.current ? 'cur' : ''}">${esc(n.title)}</a>`;
  return a;
}
// Light / dark: light unless this browser chose dark. Pages that draw with JS listen for "amber-theme".
document.getElementById('themebtn').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme !== 'dark';
  if (dark) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem('amber-theme', dark ? 'dark' : 'light'); } catch {}
  document.dispatchEvent(new Event('amber-theme'));
});
// This page's sections, in a column on the right; the one being read is highlighted.
const tocEl = document.getElementById('toc');
if (toc.length > 1) {
  tocEl.innerHTML = '<div class="toc-title">本页目录</div>' + toc.map(h => `<a href="#${esc(h.id)}">${esc(h.textContent)}</a>`).join('');
  const links = [...tocEl.querySelectorAll('a')];
  const spy = () => {
    let i = 0;
    toc.forEach((h, k) => { if (h.getBoundingClientRect().top < 120) i = k; });
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) i = toc.length - 1;
    links.forEach((a, k) => a.classList.toggle('on', k === i));
  };
  addEventListener('scroll', spy, { passive: true });
  spy();
} else document.body.classList.add('no-toc');
if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
</script>
