  --accent: #f2a23a; --accent-press: #b8620e; --accent-soft: rgba(242, 162, 58, 0.16); --on-accent: #181818; --ok: #03904a; --warn: #f13a2c; --info: #4c98b9;

  --font: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", system-ui, sans-serif;

}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.75 "PingFang SC", "Noto Sans SC", system-ui, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 1; }
header img { width: 28px; height: 28px; border-radius: 7px; }
header .brand { font-weight: 700; font-size: 17px; color: var(--ink); text-decoration: none; }
header .back { margin-left: auto; color: var(--muted); font-size: 14px; text-decoration: none; }
header .back:hover { color: var(--accent-ink); }
header .gh { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; text-decoration: none; margin-left: 16px; }
header .gh:hover { color: var(--accent-ink); }
header .gh svg { width: 18px; height: 18px; fill: currentColor; }
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr) 200px; max-width: 1400px; margin: 0 auto; }
nav { padding: 24px 12px; border-right: 1px solid var(--line); font-size: 14px; position: sticky; top: 49px; align-self: start; max-height: calc(100vh - 49px); overflow: auto; }
nav .group { color: var(--muted); font-size: 12px; margin: 14px 8px 4px; }
nav a { display: block; padding: 5px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav a:hover { background: var(--accent-soft); }
nav a.cur { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
article { padding: 24px 40px 80px; min-width: 0; }
article h1 { font-size: 28px; margin: 8px 0 16px; }
article h2 { font-size: 21px; margin: 36px 0 12px; padding-top: 8px; border-top: 1px solid var(--line); }
article h3 { font-size: 17px; margin: 24px 0 8px; }
article a { color: var(--accent-ink); }
article table { border-collapse: collapse; margin: 12px 0; font-size: 15px; display: block; overflow-x: auto; }
article th, article td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; vertical-align: top; }
article th { background: var(--panel); }
article td:first-child { min-width: 5.5em; }
article code { font-family: ui-monospace, Menlo, monospace; font-size: 0.88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
article pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; overflow: auto; line-height: 1.55; }
article pre code { background: none; padding: 0; font-size: 13px; }
article blockquote { margin: 12px 0; padding: 4px 16px; border-left: 3px solid var(--accent); color: var(--muted); background: var(--panel); }
.hljs-keyword, .hljs-built_in, .hljs-literal { color: var(--hl-kw); font-weight: 600; }
.hljs-string, .hljs-regexp { color: var(--hl-str); }
.hljs-number { color: var(--hl-num); }
.hljs-comment { color: var(--hl-cmt); font-style: italic; }
.hljs-title, .hljs-title.function_, .hljs-title.class_ { color: var(--hl-fn); }
.hljs-meta, .hljs-attr, .hljs-name, .hljs-tag { color: var(--hl-meta); }
@media (max-width: 860px) {

/* ---- Ferrari-inspired overrides ---- */
body { font-family: var(--font); font-size: 15px; }
header { height: 64px; padding: 0 24px; }
header img { border-radius: 0; }
header .brand { font-weight: 500; font-size: 15px; letter-spacing: 1.4px; text-transform: uppercase; }

nav a.cur { background: none; color: var(--ink); font-weight: 600; border-left-color: var(--accent); }

article hr { border: none; border-top: 1px solid var(--line); }
article img { display: block; max-width: 100%; height: auto; margin: 24px 0; }

.navbtn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; margin-left: -8px; padding: 0; background: none; border: 1px solid transparent; color: var(--muted); cursor: pointer; }

nav details.sec .group:first-of-type { margin-top: 12px; }
body.nav-hidden .layout { grid-template-columns: minmax(0, 1fr) 200px; max-width: 1180px; }
/* This page's sections, on the right. */
aside#toc { position: sticky; top: 65px; align-self: start; max-height: calc(100vh - 65px); overflow: auto; padding: 48px 16px 32px 0; font-size: 13px; }

aside#toc a { display: block; padding: 4px 0 4px 12px; border-left: 2px solid var(--line); color: var(--muted); text-decoration: none; line-height: 1.5; }

aside#toc a.on { color: var(--ink); border-left-color: var(--accent); }
body.no-toc .layout { grid-template-columns: 220px minmax(0, 1fr); max-width: 1180px; }

body.no-toc aside#toc { display: none; }
@media (max-width: 1180px) {
  .layout, body.no-toc .layout { grid-template-columns: 220px minmax(0, 1fr); max-width: 1180px; }
  body.nav-hidden .layout { grid-template-columns: minmax(0, 1fr); max-width: 980px; }
  aside#toc { display: none; }
}
@media (max-width: 860px) {
  .layout, body.no-toc .layout, body.nav-hidden .layout, body.no-toc.nav-hidden .layout { grid-template-columns: minmax(0, 1fr); }
}
body.nav-hidden nav { display: none; }
@media (max-width: 860px) {
  /* On a phone the menu starts hidden; the button opens it above the page. */
  body:not(.nav-open) nav { display: none; }
  body.nav-hidden.nav-open nav { display: block; }
  header { gap: 8px; padding: 0 12px; }
  header > span { display: none; }
  header .back, header .gh { white-space: nowrap; }

/* ---- Light / dark switch ---- */

:root[data-theme="dark"] .themebtn .i-sun { display: inline; }

<script>
const DATA = {"md":"# 网站操作\n\n飞书里能做的事，网站上大多也能做；另外有几件事只在网站上做：设置配置项、上架到 Store、安装、复制给同事、看历史结果。\n\n## 登录和退出\n\n1. 私聊 Amber（或在群里 @Amber）发「**登录**」。登录卡片只会发到你和 Amber 的**私聊**里，链接不会出现在群里。\n2. 点卡片上的「打开 Amber 网站」。这个链接 5 分钟内有效、只能用一次，**不要转发给别人**。\n3. 不用时点右上角「退出」。怀疑别人用了你的登录，在飞书私聊 Amber 发「**退出网站**」，所有浏览器里的登录都会失效。\n\n## 左边的列表\n\n| 分组 | 里面是什么 |\n|---|---|\n| 我的私聊 | 你在和 Amber 的私聊里的应用 |\n| 群：某某群 | 你在这个群里的应用，以及你在这个群里建的定时任务（定时任务挂在对应的应用下面） |\n| 全局应用 | 管理员设为全局的应用，所有人都能用 |\n| Amber Store | 上架的应用，可以安装 |\n| 最近运行 | 你在所有渠道（飞书、网站、agent、定时）的执行记录 |\n| 系统管理 | 只有管理员能看到：执行端、系统设置（运行限制、网络白名单、卡片页脚）、审计日志，见[管理员手册](admin.md) |\n\n列表里只有**你自己的应用**和全局应用。别人建的应用看不到；管理员能看到所有应用，但不能执行别人的。应用名旁边的标签：「已上架」= 你上架到 Store 的原版；「来自 Store」= 从 Store 装的；「需确认」= 执行前要确认。\n\n## 应用页面\n\n选中一个应用，右边上方有三页：\n\n- **执行**：填参数后执行，结果显示在下方。表格显示成表格，折线图、柱状图、饼图显示成图表，并标出数值。标着「执行前需确认」的应用，按钮要点两次。\n- **定时**：填时间（可以点常用写法填入）和时区，创建定时任务，以后每次以你的身份执行，结果发到这个群（私聊应用发到你和 Amber 的私聊），没有输出时不发。审核时没有允许定时的应用，这一页会说明原因。\n- **代码**：审核通过、实际在运行的代码，第几版、历史版本，以及审核文档链接。\n\n页面下方按情况会出现这些区块：\n\n| 区块 | 什么时候有 | 能做什么 |\n|---|---|---|\n| **配置项** | 应用有配置项 | 看当前值；创建人（或管理员）可以设置或清除。设置一次，以后每次执行（包括定时任务）自动带上，执行的人不能临时改。必填项没设置时不能执行。值不保密，看得到这个应用的人都能看到。**配置项只能在网站上设置** |\n| **密钥** | 应用声明了密钥 | 看是否已设置（只显示末尾 4 位，看不到原值）；创建人（或管理员）可以填写、覆盖、删除。值加密保存，只交给这个应用 |\n| **复制给群成员** | 你自己的群应用 | 选一个群成员发送；对方在飞书上接收后，那一份就是他自己的应用。见[应用的分享](sharing.md) |\n| **Amber Store** | 可以上架、已上架、从 Store 装的 | 申请上架；看上架状态；装来的应用有新版本时「查看改动」→「升级」 |\n| **重新分配** | 管理员看到「创建人已离群」的应用 | 交给群里另一个人，见[管理员手册](admin.md) |\n| **管理** | 你是创建人（或管理员） | 下线这个应用。已上架的原版下线时，会问你要不要同时从 Store 下架 |\n\n## 定时任务页面\n\n在列表里点应用下面的 ⏰ 定时任务：可以看到状态、下次运行、上次结果和参数；创建人可以暂停、恢复、立即运行一次、删除。管理员能暂停、恢复、删除别人的定时任务，但不能立即运行。\n\n## Amber Store\n\n左边「Amber Store」里选一个应用，可以看说明、执行时要填什么、需要哪些配置项和密钥、能做什么、完整代码和审核文档。\n\n安装：选装到哪里（你所在、并且 Amber 也在的群，或你和 Amber 的私聊），起个名字，点「安装」。不需要审批。装好后在应用页面里设置配置项和密钥（你自己的），就能用了。\n\n维护人和管理员在应用页面底部还能下架、重新上架；管理员能更换维护人；原版下线后能用「开发模式安装」接着开发。详见[应用的分享](sharing.md)。\n\n## 最近运行\n\n你自己每一次执行的记录：时间、从哪个入口执行的、参数、耗时、成功与否、出错原因，以及当时的完整结果。确认卡上只显示了部分结果的，在这里看全部。\n","nav":[{"name":"quickstart","title":"快速上手","group":"使用手册/业务开发人员","current":false},{"name":"chat","title":"Amber 机器人对话","group":"使用手册/业务开发人员","current":false},{"name":"with-agent","title":"和自己的 agent 协作","group":"使用手册/业务开发人员","current":false},{"name":"web","title":"网站操作","group":"使用手册/业务开发人员","current":true},{"name":"scenarios","title":"主要场景的实现方式","group":"使用手册/业务开发人员","current":false},{"name":"sharing","title":"应用的分享","group":"使用手册/业务开发人员","current":false},{"name":"faq","title":"常见问题","group":"使用手册/业务开发人员","current":false},{"name":"review","title":"审核指南","group":"使用手册/审核人员","current":false},{"name":"admin","title":"管理员手册","group":"使用手册/系统管理员","current":false},{"name":"install","title":"安装与部署","group":"安装运维","current":false},{"name":"feishu-setup","title":"飞书应用配置","group":"安装运维","current":false},{"name":"executor","title":"执行端与运行环境","group":"安装运维","current":false},{"name":"concepts","title":"概念模型","group":"概念模型与开发参考","current":false},{"name":"script","title":"脚本约定","group":"概念模型与开发参考","current":false},{"name":"cli-and-skill","title":"agent 接入：命令行、skill 与接口","group":"概念模型与开发参考","current":false},{"name":"identity","title":"可信身份","group":"概念模型与开发参考","current":false},{"name":"identity-example","title":"可信身份：完整示例","group":"概念模型与开发参考","current":false},{"name":"environment-format","title":"运行环境定义格式","group":"概念模型与开发参考","current":false},{"name":"usage","title":"使用指南（已拆分）","group":"","current":false}]};
const REPO = 'https://github.com/xu4wang/amber/blob/main/';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Same anchor rule as GitHub, so links written for the repo keep working here.
const slug = t => t.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');

const doc = document.getElementById('doc');
doc.innerHTML = DOMPurify.sanitize(marked.parse(DATA.md));
const names = new Set(DATA.nav.map(n => n.name));
doc.querySelectorAll('a[href]').forEach(a => {
  const h = a.getAttribute('href');
  const m = /^([a-z-]+)\.md(#.*)?$/.exec(h);
  if (m && names.has(m[1])) a.setAttribute('href', m[1] + '.html' + (m[2] || ''));
  else if (/^\.\.\//.test(h)) { a.setAttribute('href', REPO + h.replace(/^\.\.\//, '')); a.target = '_blank'; a.rel = 'noopener'; }
  else if (/^https?:/.test(h)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
});
// Diagrams (assets/*.svg) are inlined so they take the page's light / dark colours.
doc.querySelectorAll('img').forEach(async img => {
  if (!/^assets\/[a-z0-9-]+\.svg$/.test(img.getAttribute('src') || '')) return;
  try {
    const r = await fetch(img.src);
    if (!r.ok) return;
    const box = document.createElement('div');
    box.className = 'diagram';
    box.innerHTML = DOMPurify.sanitize(await r.text(), { USE_PROFILES: { svg: true } });
    const svg = box.querySelector('svg');
    if (!svg) return;
    svg.removeAttribute('width'); svg.removeAttribute('height');
    img.replaceWith(box);
  } catch {}
});
const toc = [];
doc.querySelectorAll('h2, h3').forEach(h => { h.id = slug(h.textContent); if (h.tagName === 'H2') toc.push(h); });
if (typeof hljs === 'object') doc.querySelectorAll('pre code').forEach(c => {
  const lang = (c.className.match(/language-(\w+)/) || [])[1];
  if (lang && hljs.getLanguage(lang)) hljs.highlightElement(c);
});

const cur = DATA.nav.find(n => n.current);
// Nav groups are "section/subgroup"; a page without a group stays out of the nav.
// Each section folds. On every load only the section of the current page is open.
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const curSection = cur && cur.group ? cur.group.split('/')[0] : null;
let navHtml = '', lastSection = null, lastSub = null;
for (const n of DATA.nav) {
  if (!n.group) continue;
  const [section, sub] = n.group.split('/');
  if (section !== lastSection) {
    if (lastSection !== null) navHtml += '</details>';
    const open = section === curSection;
    navHtml += `<details class="sec" data-sec="${esc(section)}"${open ? ' open' : ''}><summary>${esc(section)}</summary>`;
    lastSection = section; lastSub = null;
  }
  if (sub && sub !== lastSub) { navHtml += `<div class="group">${esc(sub)}</div>`; lastSub = sub; }
  navHtml += link(n);
}
if (lastSection !== null) navHtml += '</details>';
const nav = document.getElementById('nav');
nav.innerHTML = navHtml;

// The whole menu: hidden or shown on a wide screen (remembered), opened on demand on a phone.
const btn = document.getElementById('navbtn');
const phone = matchMedia('(max-width: 860px)');
if (store.get('amber-docs-nav-hidden')) document.body.classList.add('nav-hidden');
const shown = () => phone.matches ? document.body.classList.contains('nav-open') : !document.body.classList.contains('nav-hidden');
const sync = () => btn.setAttribute('aria-expanded', String(shown()));
btn.addEventListener('click', () => {
  if (phone.matches) document.body.classList.toggle('nav-open');
  else { document.body.classList.toggle('nav-hidden'); store.set('amber-docs-nav-hidden', document.body.classList.contains('nav-hidden')); }
  sync();
});
phone.addEventListener('change', sync);
nav.addEventListener('click', e => { if (phone.matches && e.target.closest('a')) document.body.classList.remove('nav-open'); });
sync();
function link(n) {
  const a = `<a href="${esc(n.name)}.html" class="${n.current ? 'cur' : ''}">${esc(n.title)}</a>`;
  return a;
}
// Light / dark: light unless this browser chose dark. Pages that draw with JS listen for "amber-theme".
document.getElementById('themebtn').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme !== 'dark';
  if (dark) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem('amber-theme', dark ? 'dark' : 'light'); } catch {}
  document.dispatchEvent(new Event('amber-theme'));
});
// This page's sections, in a column on the right; the one being read is highlighted.
const tocEl = document.getElementById('toc');
if (toc.length > 1) {
  tocEl.innerHTML = '<div class="toc-title">本页目录</div>' + toc.map(h => `<a href="#${esc(h.id)}">${esc(h.textContent)}</a>`).join('');
  const links = [...tocEl.querySelectorAll('a')];
  const spy = () => {
    let i = 0;
    toc.forEach((h, k) => { if (h.getBoundingClientRect().top < 120) i = k; });
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) i = toc.length - 1;
    links.forEach((a, k) => a.classList.toggle('on', k === i));
  };
  addEventListener('scroll', spy, { passive: true });
  spy();
} else document.body.classList.add('no-toc');
if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
</script>
</body>
</html>
