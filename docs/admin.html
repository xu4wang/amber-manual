<script>
const DATA = {"md":"# 管理员手册\n\n管理员负责应用**上线之后**的管理。名单由部署方写在 Amber 配置里（`admins`）。管理员和审核人是两种独立的角色：审核人决定代码能不能上线，管理员不能跳过审核让应用生效；同一个人可以兼任。\n\n## 能做什么、不能做什么\n\n| | 创建人 | 管理员 |\n|---|---|---|\n| 看到应用 | 自己的 | **所有人的**（网站上所有群的应用，包括自己不在的群） |\n| 执行应用、试运行、立即运行定时任务 | 自己的 | **只能是自己的**，不能执行别人的应用 |\n| 认领新版本 | 自己应用的 | 也只能是自己应用的（认领了就成了创建人，会用上原创建人的密钥和配置项） |\n| 设置配置项和密钥 | 自己的 | 任何应用 |\n| 下线应用 | 自己的 | 任何应用 |\n| 设为全局 / 取消全局 | — | 可以 |\n| 重新分配 | — | 创建人已不在群里的应用 |\n| 定时任务 | 自己的：暂停、恢复、删除、立即运行 | 任何人的：暂停、恢复、删除（不能立即运行别人的） |\n| Amber Store | 维护人：下架、重新上架、开发模式安装 | 下架、重新上架、开发模式安装、更换维护人 |\n| 执行端 | — | 批准、拒绝、撤销 |\n| 卡片页脚、运行限制 | — | 修改 |\n\n一句话：**管理员能看、能管、能停，但不能替别人执行**。需要用别人的应用，请对方用复制或上架的方式分享给你。\n\n## 在飞书里\n\n| 发什么 | 做什么 |\n|---|---|\n| `所有应用` | 列出所有生效中的应用（id、名字、范围） |\n| `全局 应用名`、`取消全局 应用名` | 设为全局 / 改回只在创建处可用。有重名时改用 id |\n| `下线 应用名` | 下线任何应用（确认卡 5 分钟内有效） |\n| `执行端` | 列出执行端和在线状态 |\n| `撤销执行端 名称` | 立即撤销一个执行端 |\n\n## 全局应用\n\n全局应用在 Amber 所在的任何群、任何人的私聊和网站上，所有人都能直接执行。设成全局不需要重新审核。\n\n- **密钥和配置项所有执行人共用一份**，所以用到密钥时，看到的是这个凭证的权限，不是执行人自己的权限。结果卡上会标「使用全局应用共用的密钥」。\n- 在执行端环境里运行的应用**不能设为全局**，否则任何人都能在那个机器人的环境里执行。\n- 建议只把少数确实需要所有人共用一份设置、不涉及个人凭证的应用设为全局；一般的分享用 Store。\n\n详细对比见[应用的分享](sharing.md)。\n\n## 重新分配（离职、退群的交接）\n\n创建人离开了群，他在这个群里的应用就没人能执行了。\n\n1. 网站上会给这类应用标「创建人已离群」。打开后在页面底部「重新分配」里选一个群成员，点「发送确认卡」。\n2. 对方在飞书上选「接收，并重建定时任务」「只接收应用」或「不接收」。接收后对方就是创建人，你会收到通知。\n3. 配置项和密钥保留；原来因为创建人离群而暂停的定时任务，重建后照常运行。\n\n只有创建人已不在群里的应用能重新分配；创建人还在群里时，管理员不能把他的应用转走。\n\n## 定时任务\n\n在网站上能看到所有人的定时任务，可以暂停、恢复、删除，但不能「立即运行」别人的（那等于执行别人的应用）。暂停只会让任务停下，发现问题时可以先暂停再联系创建人。\n\n## Amber Store\n\n- **下架**：不能再新装，已经装好的照常可用，原版的新版本也不再进入 Store。\n- **重新上架**：版本都审核过，不再审批。\n- **更换维护人**：在应用页面填新维护人的邮箱。维护人可以下架、重新上架，原版下线后可以用开发模式安装接着开发。\n- **开发模式安装**：原版下线后，把应用装进一个群作为新的原版，安装人成为维护人。\n\n## 执行端\n\n执行端装在数据所在的机器上，让应用在那台机器的运行环境里执行（比如读机器人的台账）。安装方法见[执行端与运行环境](executor.md)。\n\n- **批准登记**：执行端申请登记时，每位管理员会收到一张卡片，上面有来源机器、每个环境开放的全部路径（含凭证的路径标红）和**公钥指纹**。**先和安装的人核对指纹一致**，再看路径是否合理，然后批准或拒绝。批准前不会派任何任务。\n- **变化通知**：环境里路径、环境变量、Python 的改动直接生效，你会收到变化通知卡（新增的凭证路径标红），卡上可以直接撤销。新增环境、改了工作目录等要重新批准。\n- **撤销**：飞书里发「撤销执行端 名称」，或在通知卡、网站上撤销。立即停止派任务；已经启动的脚本会跑到结束或超时（最长是「运行限制」里的最长时限）。要恢复，得在那台机器上重新生成密钥再申请。\n- **网站**：左侧「执行端（管理员）」里能看每个执行端的状态、是否在线、环境路径和公钥指纹，并批准、拒绝或撤销。\n\n## 运行限制\n\n网站左侧「系统设置（管理员）→ 运行限制」：\n\n| 设置 | 初始值 | 说明 |\n|---|---|---|\n| 默认时限 | 60 秒 | 应用没有自己写时限（`timeoutMs`）时用这个 |\n| 最长时限 | 10 分钟 | 应用最多能申请这么久，超过的提交时就被拒绝；已上线的应用超过的，运行时按这个截断。最多能设到 30 分钟 |\n| Amber 本机同时运行 | 8 个 | 没有写执行位置的应用都在 Amber 这台机器上跑 |\n| 每个执行端同时运行（默认） | 4 个 | 每个执行端还可以在它自己的页面里单独设置。执行端那台机器的主人也可以在执行端配置里设 `maxParallel`，实际取两者中小的 |\n| 每人同时运行 | 2 个 | 防止一个人同时开很多长任务，把别人挤掉 |\n\n超过任何一个上限的执行会直接提示「稍后再试」，不排队。改了马上生效；时限的改动对已经在跑的不起作用。每次修改都写审计。\n\n把默认时限改长，等于放宽了已上线、没有自己写时限的应用，不需要重新审核。\n\n## 卡片页脚\n\nAmber 在飞书里发的每一张卡片，最下面都有一行页脚，默认是 Amber 项目的 GitHub 地址。管理员可以在网站左侧「系统设置（管理员）→ 卡片页脚」里改成别的内容，比如团队说明、联系人、内部文档链接。\n\n- 只能写一行，最多 200 个字。链接写成 `[文字](https://…)`\n- 不支持 @，也不支持其他格式。写进去的 `@` 和尖括号会原样显示成文字，不会提醒任何人\n- 保存后，之后发出或更新的卡片都用新页脚，已经发出的卡片不变\n- 「恢复默认」改回项目地址；「不显示页脚」去掉这一行\n- 每次修改都写审计记录\n\n## 审计\n\n认领、审核、执行、下线、全局化、重新分配、复制、上架、安装、密钥和配置项的修改、执行端的批准和撤销等操作都会写进审计记录。审计记录保存在 Amber 的数据库里（`audit` 表），目前网站上没有审计页面，需要时请部署方查询。\n","nav":[{"name":"quickstart","title":"快速上手","group":"使用手册/业务开发人员","current":false},{"name":"chat","title":"Amber 机器人对话","group":"使用手册/业务开发人员","current":false},{"name":"with-agent","title":"和自己的 agent 协作","group":"使用手册/业务开发人员","current":false},{"name":"web","title":"网站操作","group":"使用手册/业务开发人员","current":false},{"name":"scenarios","title":"主要场景的实现方式","group":"使用手册/业务开发人员","current":false},{"name":"sharing","title":"应用的分享","group":"使用手册/业务开发人员","current":false},{"name":"faq","title":"常见问题","group":"使用手册/业务开发人员","current":false},{"name":"review","title":"审核指南","group":"使用手册/审核人员","current":false},{"name":"admin","title":"管理员手册","group":"使用手册/系统管理员","current":true},{"name":"install","title":"安装与部署","group":"安装运维","current":false},{"name":"feishu-setup","title":"飞书应用配置","group":"安装运维","current":false},{"name":"executor","title":"执行端与运行环境","group":"安装运维","current":false},{"name":"concepts","title":"概念模型","group":"概念模型与开发参考","current":false},{"name":"script","title":"脚本约定","group":"概念模型与开发参考","current":false},{"name":"cli-and-skill","title":"agent 接入：命令行、skill 与接口","group":"概念模型与开发参考","current":false},{"name":"identity","title":"可信身份","group":"概念模型与开发参考","current":false},{"name":"identity-example","title":"可信身份：完整示例","group":"概念模型与开发参考","current":false},{"name":"environment-format","title":"运行环境定义格式","group":"概念模型与开发参考","current":false},{"name":"usage","title":"使用指南（已拆分）","group":"","current":false}]};
const REPO = 'https://github.com/xu4wang/amber/blob/main/';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Same anchor rule as GitHub, so links written for the repo keep working here.
const slug = t => t.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');

const doc = document.getElementById('doc');
doc.innerHTML = DOMPurify.sanitize(marked.parse(DATA.md));
const names = new Set(DATA.nav.map(n => n.name));
doc.querySelectorAll('a[href]').forEach(a => {
  const h = a.getAttribute('href');
  const m = /^([a-z-]+)\.md(#.*)?$/.exec(h);
  if (m && names.has(m[1])) a.setAttribute('href', m[1] + '.html' + (m[2] || ''));
  else if (/^\.\.\//.test(h)) { a.setAttribute('href', REPO + h.replace(/^\.\.\//, '')); a.target = '_blank'; a.rel = 'noopener'; }
  else if (/^https?:/.test(h)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
});
// Diagrams (assets/*.svg) are inlined so they take the page's light / dark colours.
doc.querySelectorAll('img').forEach(async img => {
  if (!/^assets\/[a-z0-9-]+\.svg$/.test(img.getAttribute('src') || '')) return;
  try {
    const r = await fetch(img.src);
    if (!r.ok) return;
    const box = document.createElement('div');
    box.className = 'diagram';
    box.innerHTML = DOMPurify.sanitize(await r.text(), { USE_PROFILES: { svg: true } });
    const svg = box.querySelector('svg');
    if (!svg) return;
    svg.removeAttribute('width'); svg.removeAttribute('height');
    img.replaceWith(box);
  } catch {}
});
const toc = [];
doc.querySelectorAll('h2, h3').forEach(h => { h.id = slug(h.textContent); if (h.tagName === 'H2') toc.push(h); });
if (typeof hljs === 'object') doc.querySelectorAll('pre code').forEach(c => {
  const lang = (c.className.match(/language-(\w+)/) || [])[1];
  if (lang && hljs.getLanguage(lang)) hljs.highlightElement(c);
});

const cur = DATA.nav.find(n => n.current);
// Nav groups are "section/subgroup"; a page without a group stays out of the nav.
// Each section folds. On every load only the section of the current page is open.
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const curSection = cur && cur.group ? cur.group.split('/')[0] : null;
let navHtml = '', lastSection = null, lastSub = null;
for (const n of DATA.nav) {
  if (!n.group) continue;
  const [section, sub] = n.group.split('/');
  if (section !== lastSection) {
    if (lastSection !== null) navHtml += '</details>';
    const open = section === curSection;
    navHtml += `<details class="sec" data-sec="${esc(section)}"${open ? ' open' : ''}><summary>${esc(section)}</summary>`;
    lastSection = section; lastSub = null;
  }
  if (sub && sub !== lastSub) { navHtml += `<div class="group">${esc(sub)}</div>`; lastSub = sub; }
  navHtml += link(n);
}
if (lastSection !== null) navHtml += '</details>';
const nav = document.getElementById('nav');
nav.innerHTML = navHtml;

// The whole menu: hidden or shown on a wide screen (remembered), opened on demand on a phone.
const btn = document.getElementById('navbtn');
const phone = matchMedia('(max-width: 860px)');
if (store.get('amber-docs-nav-hidden')) document.body.classList.add('nav-hidden');
const shown = () => phone.matches ? document.body.classList.contains('nav-open') : !document.body.classList.contains('nav-hidden');
const sync = () => btn.setAttribute('aria-expanded', String(shown()));
btn.addEventListener('click', () => {
  if (phone.matches) document.body.classList.toggle('nav-open');
  else { document.body.classList.toggle('nav-hidden'); store.set('amber-docs-nav-hidden', document.body.classList.contains('nav-hidden')); }
  sync();
});
phone.addEventListener('change', sync);
nav.addEventListener('click', e => { if (phone.matches && e.target.closest('a')) document.body.classList.remove('nav-open'); });
sync();
function link(n) {
  const a = `<a href="${esc(n.name)}.html" class="${n.current ? 'cur' : ''}">${esc(n.title)}</a>`;
  return a;
}
// Light / dark: light unless this browser chose dark. Pages that draw with JS listen for "amber-theme".
document.getElementById('themebtn').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme !== 'dark';
  if (dark) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem('amber-theme', dark ? 'dark' : 'light'); } catch {}
  document.dispatchEvent(new Event('amber-theme'));
});
// This page's sections, in a column on the right; the one being read is highlighted.
const tocEl = document.getElementById('toc');
if (toc.length > 1) {
  tocEl.innerHTML = '<div class="toc-title">本页目录</div>' + toc.map(h => `<a href="#${esc(h.id)}">${esc(h.textContent)}</a>`).join('');
  const links = [...tocEl.querySelectorAll('a')];
  const spy = () => {
    let i = 0;
    toc.forEach((h, k) => { if (h.getBoundingClientRect().top < 120) i = k; });
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) i = toc.length - 1;
    links.forEach((a, k) => a.classList.toggle('on', k === i));
  };
  addEventListener('scroll', spy, { passive: true });
  spy();
} else document.body.classList.add('no-toc');
if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
</script>
