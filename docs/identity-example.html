<script>
const DATA = {"md":"# 可信身份：完整示例\n\n本文用一个能运行的 Python 例子，走一遍「让固化应用以执行人的身份调用后端服务」的完整流程。例子的代码在仓库 [`examples/identity-service/`](../examples/identity-service/) 里。原理和凭证格式见 [可信身份](identity.md)。\n\n## 1. 先分清两样东西\n\n使用可信身份时，涉及的不是一个脚本，而是两样东西：\n\n| | 服务 | 应用脚本 |\n|---|---|---|\n| 是什么 | 一个**常驻的后端程序**，例如 Data MCP 或者你们自己的查询服务 | 固化应用里的那段 Python |\n| 谁写、谁运行 | 服务方写，由运维部署在 Amber 所在的机器上，一直运行 | agent 写，经认领和审核，每次执行时由 Amber 在沙盒里运行一次 |\n| 拿着什么 | 数据库账号、权限规则等真正的访问能力 | 只有 Amber 为本次执行签发的一张凭证，5 分钟内有效，只能用一次 |\n| 负责什么 | 验证凭证，按凭证里的执行人只返回他有权限的数据 | 带着凭证调用服务，把结果整理成 Markdown 输出 |\n\n这样分工的好处：脚本永远碰不到数据库账号，也冒充不了别人。脚本能拿到什么数据，完全由服务按「真正点按钮的那个人」来判断。\n\n一次执行的过程：\n\n![可信身份的调用流程：执行人点执行，Amber 为执行人签发凭证并在沙盒里运行脚本，脚本带凭证调用服务，服务验签后按执行人的权限返回数据](assets/identity-flow.svg)\n\n## 2. 写服务\n\n[`service.py`](../examples/identity-service/service.py) 是一个只有 Python 标准库加 `cryptography` 的 HTTP 服务。它提供 `GET /sales`，返回「调用人有权限的区域」的销售额。权限规则写在 [`data.json`](../examples/identity-service/data.json) 里：\n\n```json\n{\n  \"permissions\": { \"on_某人的union_id\": [\"华东\", \"华南\"] },\n  \"sales\": [ { \"region\": \"华东\", \"month\": \"2026-09\", \"amount\": 1410000 } ]\n}\n```\n\n服务验证凭证的核心代码（完整代码见文件）：\n\n```python\ndef verify(token):\n    h, p, s = token.split(\".\")\n    header, payload = json.loads(b64(h)), json.loads(b64(p))\n    if header.get(\"alg\") != \"EdDSA\":\n        raise Rejected(\"算法不对\")\n    key = KEYS.get(header.get(\"kid\"))            # Amber 公钥，启动时从固定文件读入；不认识的 kid 直接拒绝\n    key.verify(b64(s), f\"{h}.{p}\".encode())       # 签名不对会抛异常\n    if payload[\"iss\"] != \"amber\":                 raise Rejected(\"签发方不对\")\n    if payload[\"aud\"] != AUDIENCE:                raise Rejected(\"这张凭证不是发给本服务的\")\n    if payload[\"exp\"] \u003c time.time() - 30:         raise Rejected(\"凭证已过期\")\n    if payload[\"jti\"] in USED:                    raise Rejected(\"凭证已经用过\")\n    USED[payload[\"jti\"]] = payload[\"exp\"]\n    return payload\n\n# 处理请求时，只认凭证里的 sub，不认请求里自称的任何身份\nuser = verify(auth[len(\"Amber \"):])[\"sub\"]\nrows = [r for r in data[\"sales\"] if r[\"region\"] in data[\"permissions\"].get(user, [])]\n```\n\n部署和启动：\n\n```sh\npython3 -m venv ~/demo-service-venv\n~/demo-service-venv/bin/pip install cryptography\ncd examples/identity-service\n# 部署时由 Amber 部署方导出公钥（直接从私钥文件推出，不经端口），核对 kid 后原子替换；之后服务只读这个文件\n(cd ~/amber && node src/cli.ts keys) > amber-keys.json.tmp && mv amber-keys.json.tmp amber-keys.json\nDEMO_PORT=18790 DEMO_AUDIENCE=demo-profile ~/demo-service-venv/bin/python service.py\n# 输出：demo service on 127.0.0.1:18790, audience=demo-profile, keys=[...]\n```\n\n注意：\n\n- 服务**只监听 127.0.0.1**，和 Amber 在同一台机器上。\n- 端口要选一个没被占用的。先用 `lsof -nP -iTCP:\u003c端口> -sTCP:LISTEN` 检查。如果端口上其实是别的程序，凭证就会被发给那个程序。\n- 正式使用时，用 launchd 之类的工具让服务常驻，写法参照 [安装与部署](install.md#常驻运行launchd) 里 Amber 自己的 plist。\n- 服务**运行时不访问** Amber 的 7341 端口，只认 `amber-keys.json` 里的公钥：Amber 停掉时，本机任何进程都能占用这个端口冒充 Amber 发布公钥。Amber 换密钥时，先把新旧两把都写进文件、重启服务，等旧凭证全部过期（最长 5 分钟）后再删掉旧的。\n- 示例把用过的 `jti` 放在内存里，服务重启后就忘了；正式服务要持久化保存到 `exp` 之后。\n\n## 3. 在 Amber 里登记服务\n\n在 Amber 的 `~/.config/amber/config.json` 里加上：\n\n```json\n\"services\": {\n  \"demo-profile\": { \"audience\": \"demo-profile\", \"tcpPort\": 18790 }\n}\n```\n\n- 键名 `demo-profile` 是应用脚本里声明服务时用的名字。\n- `audience` 会写进凭证的 `aud`，必须和服务端的 `DEMO_AUDIENCE` 一致。\n- `tcpPort` 是服务监听的端口。也可以改用 `\"unixSocket\": \"/path/to/service.sock\"`。\n\n改完重启 Amber（`launchctl kickstart -k gui/$(id -u)/\u003c你的 Amber label>`）。登记服务是**部署方**的操作：agent 和应用都改不了这里，只能使用已经登记的服务。\n\n## 4. 写应用脚本\n\n[`command_script.py`](../examples/identity-service/command_script.py)：\n\n```python\nimport json, sys, urllib.request\n\ninp = json.load(sys.stdin)\nsvc = inp[\"services\"][\"demo-profile\"]          # Amber 为本次执行签发的凭证和服务地址\nreq = urllib.request.Request(\n    f\"http://127.0.0.1:{svc['tcpPort']}/sales\",\n    headers={\"Authorization\": \"Amber \" + svc[\"tokens\"][0]},   # 每次请求用一张，每张只能用一次\n)\nopener = urllib.request.build_opener(urllib.request.ProxyHandler({}))  # 本机服务，不走代理\ntry:\n    with opener.open(req, timeout=10) as r:\n        data = json.load(r)\nexcept urllib.error.HTTPError as e:\n    # 写到标准错误并以非 0 退出：Amber 把它当作执行失败，并把这句话显示给执行人\n    sys.exit(\"服务拒绝了请求：\" + json.loads(e.read().decode(\"utf-8\")).get(\"error\", str(e.code)))\n\nrows = data[\"rows\"]\nif not rows:\n    print(\"你没有任何区域的数据权限。\")\n    sys.exit(0)\nprint(f\"**你能看到的区域**：{'、'.join(data['regions'])}\\n\")\nprint(\"```table\")\nprint(json.dumps({\"columns\": [\n    {\"name\": \"region\", \"label\": \"区域\", \"type\": \"text\"},\n    {\"name\": \"month\", \"label\": \"月份\", \"type\": \"text\"},\n    {\"name\": \"amount\", \"label\": \"销售额\", \"type\": \"number\"}], \"rows\": rows}, ensure_ascii=False))\nprint(\"```\")\n```\n\n要点：\n\n- 端口和凭证都从标准输入里的 `services` 读，**不要写死**。\n- 只用标准库，因为沙盒里没有第三方库。\n- 访问本机服务时要绕过代理（`ProxyHandler({})`）。\n\n## 5. 提交、认领、审核\n\n草稿 [`draft.json`](../examples/identity-service/draft.json) 的关键部分：\n\n```json\n{\n  \"name\": \"我的销售额\",\n  \"description\": \"以执行人本人的身份，查询他有权限看的区域销售额（可信身份示例）\",\n  \"params\": [],\n  \"script\": {\n    \"kind\": \"script\", \"lang\": \"python\",\n    \"network\": false,\n    \"services\": {\"demo-profile\": {\"calls\": 1}},\n    \"timeoutMs\": 15000,\n    \"code\": \"……command_script.py 的内容……\"\n  },\n  \"options\": { \"confirm\": false, \"schedulable\": true }\n}\n```\n\n- `services` 声明要用哪些已登记的服务，以及每次执行最多调用几次（`calls`，1–20）。运行时拿到同样多张凭证，每张只能用一次。声明了服务就**不能**再设 `network: true`，提交时会被拒绝，这样查到的数据无法外传。\n- 实际使用时，由 agent 填好 `chatId`、`chatType`、`claimer`，再运行 `amber submit draft.json --label \u003cbot 名>`。\n\n之后的流程和普通应用一样：\n\n1. 认领人点「**试运行**」，Amber 以认领人的身份签发凭证，`channel` 是 `bot.trial`，服务据此知道这是试运行。服务方也可以选择拒绝试运行。\n2. 认领人点「**提交审核**」。审核人在知识库文档里能看到这段代码，也能看到它声明了 `demo-profile`。\n3. 所有审核人同意后，应用生效。\n\n## 6. 执行\n\n| 从哪里执行 | 凭证里的执行人 `sub` | `channel` |\n|---|---|---|\n| 飞书里点表单的「执行」 | 点按钮的人 | `bot` |\n| 网站上点「执行」 | 登录的人 | `web` |\n| 对 agent 说「跑一下我的销售额」 | 声明了服务的应用要用到某个人的身份，所以 agent **不能直接执行**，Amber 会发确认卡片，凭证签给**点卡片的人** | `agent` |\n| 定时任务 | 定时任务的创建人 | `schedule` |\n\n服务每处理一次请求都会打一行审计日志：\n\n```text\n2026-10-07 23:21:42 caller_source=amber sub=on_xxx cmd=… rev=… run=… channel=web rows=4\n```\n\n同一个应用，不同的人执行，看到的是各自有权限的区域。没有权限的人会看到「你没有任何区域的数据权限」。\n\n## 7. 常见问题\n\n| 现象 | 原因 |\n|---|---|\n| 执行失败：「服务拒绝了请求：这张凭证不是发给本服务的」 | Amber 配置里的 `audience` 和服务的 `DEMO_AUDIENCE` 不一致 |\n| 执行失败：「服务拒绝了请求：凭证已经用过」 | 脚本用同一张凭证请求了两次。每次执行只签一张，每张只能用一次；需要多次请求时，服务方可以改成「同一次执行（`run`）内允许多次」 |\n| 执行失败：「不认识的密钥」 | 服务启动时 Amber 还没起来，或者 Amber 换了签名密钥。重启服务即可，它会重新拉取公钥 |\n| 执行失败：连接被拒绝或超时 | 服务没在运行，或者端口和 Amber 配置不一致。沙盒只放行配置里登记的那个端口 |\n| agent 说要发确认卡片，不能直接执行 | 这是设计如此：凡是声明了服务的应用，都必须由本人点一下，见 [可信身份](identity.md#1-身份从哪来) |\n\n本文的例子在 Amber 所在的机器上实测过：\n- 有权限的人只拿到自己那两个区域的 4 行数据；\n- 没有权限的人拿到 0 行；\n- 同一张凭证第二次使用、发给别的服务的凭证，都被服务拒绝；\n- 沙盒里的脚本连不上外网，也连不上没登记的本机端口。\n","nav":[{"name":"quickstart","title":"快速上手","group":"使用手册/业务开发人员","current":false},{"name":"chat","title":"Amber 机器人对话","group":"使用手册/业务开发人员","current":false},{"name":"with-agent","title":"和自己的 agent 协作","group":"使用手册/业务开发人员","current":false},{"name":"web","title":"网站操作","group":"使用手册/业务开发人员","current":false},{"name":"scenarios","title":"主要场景的实现方式","group":"使用手册/业务开发人员","current":false},{"name":"sharing","title":"应用的分享","group":"使用手册/业务开发人员","current":false},{"name":"faq","title":"常见问题","group":"使用手册/业务开发人员","current":false},{"name":"review","title":"审核指南","group":"使用手册/审核人员","current":false},{"name":"admin","title":"管理员手册","group":"使用手册/系统管理员","current":false},{"name":"install","title":"安装与部署","group":"安装运维","current":false},{"name":"feishu-setup","title":"飞书应用配置","group":"安装运维","current":false},{"name":"executor","title":"执行端与运行环境","group":"安装运维","current":false},{"name":"concepts","title":"概念模型","group":"概念模型与开发参考","current":false},{"name":"script","title":"脚本约定","group":"概念模型与开发参考","current":false},{"name":"cli-and-skill","title":"agent 接入：命令行、skill 与接口","group":"概念模型与开发参考","current":false},{"name":"identity","title":"可信身份","group":"概念模型与开发参考","current":false},{"name":"identity-example","title":"可信身份：完整示例","group":"概念模型与开发参考","current":true},{"name":"environment-format","title":"运行环境定义格式","group":"概念模型与开发参考","current":false},{"name":"usage","title":"使用指南（已拆分）","group":"","current":false}]};
const REPO = 'https://github.com/xu4wang/amber/blob/main/';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Same anchor rule as GitHub, so links written for the repo keep working here.
const slug = t => t.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');

const doc = document.getElementById('doc');
doc.innerHTML = DOMPurify.sanitize(marked.parse(DATA.md));
const names = new Set(DATA.nav.map(n => n.name));
doc.querySelectorAll('a[href]').forEach(a => {
  const h = a.getAttribute('href');
  const m = /^([a-z-]+)\.md(#.*)?$/.exec(h);
  if (m && names.has(m[1])) a.setAttribute('href', m[1] + '.html' + (m[2] || ''));
  else if (/^\.\.\//.test(h)) { a.setAttribute('href', REPO + h.replace(/^\.\.\//, '')); a.target = '_blank'; a.rel = 'noopener'; }
  else if (/^https?:/.test(h)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
});
// Diagrams (assets/*.svg) are inlined so they take the page's light / dark colours.
doc.querySelectorAll('img').forEach(async img => {
  if (!/^assets\/[a-z0-9-]+\.svg$/.test(img.getAttribute('src') || '')) return;
  try {
    const r = await fetch(img.src);
    if (!r.ok) return;
    const box = document.createElement('div');
    box.className = 'diagram';
    box.innerHTML = DOMPurify.sanitize(await r.text(), { USE_PROFILES: { svg: true } });
    const svg = box.querySelector('svg');
    if (!svg) return;
    svg.removeAttribute('width'); svg.removeAttribute('height');
    img.replaceWith(box);
  } catch {}
});
const toc = [];
doc.querySelectorAll('h2, h3').forEach(h => { h.id = slug(h.textContent); if (h.tagName === 'H2') toc.push(h); });
if (typeof hljs === 'object') doc.querySelectorAll('pre code').forEach(c => {
  const lang = (c.className.match(/language-(\w+)/) || [])[1];
  if (lang && hljs.getLanguage(lang)) hljs.highlightElement(c);
});

const cur = DATA.nav.find(n => n.current);
// Nav groups are "section/subgroup"; a page without a group stays out of the nav.
// Each section folds. On every load only the section of the current page is open.
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const curSection = cur && cur.group ? cur.group.split('/')[0] : null;
let navHtml = '', lastSection = null, lastSub = null;
for (const n of DATA.nav) {
  if (!n.group) continue;
  const [section, sub] = n.group.split('/');
  if (section !== lastSection) {
    if (lastSection !== null) navHtml += '</details>';
    const open = section === curSection;
    navHtml += `<details class="sec" data-sec="${esc(section)}"${open ? ' open' : ''}><summary>${esc(section)}</summary>`;
    lastSection = section; lastSub = null;
  }
  if (sub && sub !== lastSub) { navHtml += `<div class="group">${esc(sub)}</div>`; lastSub = sub; }
  navHtml += link(n);
}
if (lastSection !== null) navHtml += '</details>';
const nav = document.getElementById('nav');
nav.innerHTML = navHtml;

// The whole menu: hidden or shown on a wide screen (remembered), opened on demand on a phone.
const btn = document.getElementById('navbtn');
const phone = matchMedia('(max-width: 860px)');
if (store.get('amber-docs-nav-hidden')) document.body.classList.add('nav-hidden');
const shown = () => phone.matches ? document.body.classList.contains('nav-open') : !document.body.classList.contains('nav-hidden');
const sync = () => btn.setAttribute('aria-expanded', String(shown()));
btn.addEventListener('click', () => {
  if (phone.matches) document.body.classList.toggle('nav-open');
  else { document.body.classList.toggle('nav-hidden'); store.set('amber-docs-nav-hidden', document.body.classList.contains('nav-hidden')); }
  sync();
});
phone.addEventListener('change', sync);
nav.addEventListener('click', e => { if (phone.matches && e.target.closest('a')) document.body.classList.remove('nav-open'); });
sync();
function link(n) {
  const a = `<a href="${esc(n.name)}.html" class="${n.current ? 'cur' : ''}">${esc(n.title)}</a>`;
  return a;
}
// Light / dark: light unless this browser chose dark. Pages that draw with JS listen for "amber-theme".
document.getElementById('themebtn').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme !== 'dark';
  if (dark) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem('amber-theme', dark ? 'dark' : 'light'); } catch {}
  document.dispatchEvent(new Event('amber-theme'));
});
// This page's sections, in a column on the right; the one being read is highlighted.
const tocEl = document.getElementById('toc');
if (toc.length > 1) {
  tocEl.innerHTML = '<div class="toc-title">本页目录</div>' + toc.map(h => `<a href="#${esc(h.id)}">${esc(h.textContent)}</a>`).join('');
  const links = [...tocEl.querySelectorAll('a')];
  const spy = () => {
    let i = 0;
    toc.forEach((h, k) => { if (h.getBoundingClientRect().top < 120) i = k; });
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) i = toc.length - 1;
    links.forEach((a, k) => a.classList.toggle('on', k === i));
  };
  addEventListener('scroll', spy, { passive: true });
  spy();
} else document.body.classList.add('no-toc');
if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
</script>
