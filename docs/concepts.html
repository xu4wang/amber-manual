<script>
const DATA = {"md":"# 概念模型\n\n这一页给开发人员和想了解原理的人：Amber 里的主要对象是什么、它们之间是什么关系、由谁决定。日常使用不需要读。\n\n## 总览\n\n![应用的生命周期：草稿经认领、试运行和审核后生效；生效的应用可以执行、定时、设置配置项和密钥、分享](assets/lifecycle.svg)\n\n## 应用、版本和指令线\n\n- **应用**：一段审核过的脚本，加上它的参数和选项。审核通过的那一份按内容算一个哈希（spec hash），执行前每次都核对，代码有任何改动都要重新审核。\n- **版本**：同一个应用的新版本是一条新的记录，审核通过后替换旧版本（旧版本变成「已下线」）。同一时间一个应用只有一个生效的版本，和至多一个在认领或审核中的版本。\n- **指令线**（line）：把一个应用的各个版本串起来的身份。配置项、密钥都挂在「群 + 指令线」上，所以出新版本时沿用，下线时删除。agent 提交的应用，指令线就是它的名字；从 Store 装的、复制来的应用有各自的指令线，所以同一个群里几个人可以各有一个同名应用，互不相干。\n- **创建人**：认领应用的人，是这个应用的负责人。\n\n## 可见范围\n\n- 一个应用属于创建它的人，建在哪个群（或私聊）就在哪里用。**只有创建人自己看得见、能执行。**\n- **全局应用**：管理员设为全局后，所有人在所有地方都能执行，共用一份配置项和密钥。\n- **管理员**能看到所有应用、能管理（下线、设置、暂停定时任务、重新分配），但不能执行别人的应用。\n\n## 执行身份\n\n- 每次执行都有一个执行人：发消息或点卡片的人；agent 发起的，是点确认卡的人；定时任务是定时任务的创建人。身份只来自飞书事件或网站登录，agent 和脚本给不出身份。\n- 应用声明了**数据服务**时，Amber 每次执行给服务签发一张代表执行人的短时效签名凭证（每次调用一张，用过作废），服务按执行人的权限返回数据。见[可信身份](identity.md)。\n- 不需要身份的应用（不调数据服务、不需要确认、不用密钥），agent 可以直接执行，执行人记为 agent。\n\n## 审核\n\n- 新应用、新版本、上架都要审核；全部审核人同意才生效。\n- 审核看的是代码和它声明的能力：参数和配置项、密钥名字、是否联网、调用哪些服务、执行位置、执行前确认、允许定时。这些都写在应用定义里，随代码一起锁定。\n- 下线、全局化、重新分配、复制、安装都不需要审核：它们用的都是已经审核过的版本，或者只会缩小能力。\n\n## 参数、配置项、密钥\n\n| | 谁填 | 什么时候 | 保密 | 能不能被执行人改 |\n|---|---|---|---|---|\n| 参数 | 执行人 | 每次执行 | 否 | 能 |\n| 配置项 | 创建人或管理员，在网站上 | 设置一次，每次执行自动带上 | 否 | 不能 |\n| 密钥 | 创建人或管理员，在私聊卡片或网站上 | 设置一次 | 是：加密保存，只交给这个应用，输出里出现会被遮盖 | 不能 |\n\n名字和类型随代码审核，值不审核。\n\n## 定时任务\n\n- 定时任务 = 应用 + 参数 + 时间规则 + 创建人。每次以创建人身份执行，结果发到创建时的群、话题或私聊；没有输出就不发。\n- 应用下线、出新版本、不再允许定时、创建人退群时自动暂停。定时任务不能转给别人。\n\n## Amber Store\n\n- **Store 应用**：从一个生效中的应用上架而来，每个版本都是一份审核过的定义。\n- **原版**：发起上架的那个应用。它审核通过的新版本，就是 Store 应用的新版本。\n- **安装**：在某个群或私聊里新建一个属于安装人的应用，内容和 Store 应用的某个版本一致，直接生效，不审批。安装人自己设置配置项和密钥，自己决定什么时候升级。\n- **维护人**：原版的创建人（管理员可以更换）。可以下架、重新上架；原版下线后可以用开发模式安装，让一份安装成为新的原版。\n\n## 其他分享方式\n\n- **复制给群成员**：创建人把群应用复制一份给同群的人，对方接收后是一个独立的新应用（自己的指令线），复制配置项、不复制密钥。\n- **重新分配**：创建人离群后，管理员把应用交给群里另一个人；应用不变，只换创建人，配置项和密钥保留。\n\n四种方式的对比见[应用的分享](sharing.md)。\n\n## 执行位置：执行端、运行环境、沙箱\n\n![执行位置：不写运行环境的应用在 Amber 本机沙箱运行；写了 env 的应用在执行端上、按运行环境的权限在沙箱里运行](assets/run-location.svg)\n\n| 概念 | 是什么 |\n|---|---|\n| **沙箱** | 每次执行都在 macOS 沙箱里跑：默认只能读写本次运行的临时目录，读系统目录和常见工具链；不联网，除非声明了「可以访问外网」或调用数据服务 |\n| **执行端** | 装在数据所在机器上的执行程序，管理员核对公钥指纹后批准。Amber 把任务加密发给它，它在本机执行后把结果签名返回 |\n| **运行环境** | 执行端上一个有名字的权限范围：能读写、只读、禁止哪些路径，工作目录、Python、环境变量。可以从 botmux 机器人导出（和机器人自己的沙箱权限一致）。管理员批准 |\n\n应用写了 `env: \"执行端名/环境名\"` 就在那里运行，能访问的数据完全由环境决定；不写就在 Amber 本机的沙箱里运行，看不到任何业务数据。执行端上的应用调用数据服务时，请求经 Amber 转发，身份规则不变。详见[执行端与运行环境](executor.md)和[运行环境定义格式](environment-format.md)。\n","nav":[{"name":"quickstart","title":"快速上手","group":"使用手册/业务开发人员","current":false},{"name":"chat","title":"Amber 机器人对话","group":"使用手册/业务开发人员","current":false},{"name":"with-agent","title":"和自己的 agent 协作","group":"使用手册/业务开发人员","current":false},{"name":"web","title":"网站操作","group":"使用手册/业务开发人员","current":false},{"name":"scenarios","title":"主要场景的实现方式","group":"使用手册/业务开发人员","current":false},{"name":"sharing","title":"应用的分享","group":"使用手册/业务开发人员","current":false},{"name":"faq","title":"常见问题","group":"使用手册/业务开发人员","current":false},{"name":"review","title":"审核指南","group":"使用手册/审核人员","current":false},{"name":"admin","title":"管理员手册","group":"使用手册/系统管理员","current":false},{"name":"install","title":"安装与部署","group":"安装运维","current":false},{"name":"feishu-setup","title":"飞书应用配置","group":"安装运维","current":false},{"name":"executor","title":"执行端与运行环境","group":"安装运维","current":false},{"name":"concepts","title":"概念模型","group":"概念模型与开发参考","current":true},{"name":"script","title":"脚本约定","group":"概念模型与开发参考","current":false},{"name":"cli-and-skill","title":"agent 接入：命令行、skill 与接口","group":"概念模型与开发参考","current":false},{"name":"identity","title":"可信身份","group":"概念模型与开发参考","current":false},{"name":"identity-example","title":"可信身份：完整示例","group":"概念模型与开发参考","current":false},{"name":"environment-format","title":"运行环境定义格式","group":"概念模型与开发参考","current":false},{"name":"usage","title":"使用指南（已拆分）","group":"","current":false}]};
const REPO = 'https://github.com/xu4wang/amber/blob/main/';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Same anchor rule as GitHub, so links written for the repo keep working here.
const slug = t => t.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');

const doc = document.getElementById('doc');
doc.innerHTML = DOMPurify.sanitize(marked.parse(DATA.md));
const names = new Set(DATA.nav.map(n => n.name));
doc.querySelectorAll('a[href]').forEach(a => {
  const h = a.getAttribute('href');
  const m = /^([a-z-]+)\.md(#.*)?$/.exec(h);
  if (m && names.has(m[1])) a.setAttribute('href', m[1] + '.html' + (m[2] || ''));
  else if (/^\.\.\//.test(h)) { a.setAttribute('href', REPO + h.replace(/^\.\.\//, '')); a.target = '_blank'; a.rel = 'noopener'; }
  else if (/^https?:/.test(h)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
});
// Diagrams (assets/*.svg) are inlined so they take the page's light / dark colours.
doc.querySelectorAll('img').forEach(async img => {
  if (!/^assets\/[a-z0-9-]+\.svg$/.test(img.getAttribute('src') || '')) return;
  try {
    const r = await fetch(img.src);
    if (!r.ok) return;
    const box = document.createElement('div');
    box.className = 'diagram';
    box.innerHTML = DOMPurify.sanitize(await r.text(), { USE_PROFILES: { svg: true } });
    const svg = box.querySelector('svg');
    if (!svg) return;
    svg.removeAttribute('width'); svg.removeAttribute('height');
    img.replaceWith(box);
  } catch {}
});
const toc = [];
doc.querySelectorAll('h2, h3').forEach(h => { h.id = slug(h.textContent); if (h.tagName === 'H2') toc.push(h); });
if (typeof hljs === 'object') doc.querySelectorAll('pre code').forEach(c => {
  const lang = (c.className.match(/language-(\w+)/) || [])[1];
  if (lang && hljs.getLanguage(lang)) hljs.highlightElement(c);
});

const cur = DATA.nav.find(n => n.current);
// Nav groups are "section/subgroup"; a page without a group stays out of the nav.
// Each section folds. On every load only the section of the current page is open.
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const curSection = cur && cur.group ? cur.group.split('/')[0] : null;
let navHtml = '', lastSection = null, lastSub = null;
for (const n of DATA.nav) {
  if (!n.group) continue;
  const [section, sub] = n.group.split('/');
  if (section !== lastSection) {
    if (lastSection !== null) navHtml += '</details>';
    const open = section === curSection;
    navHtml += `<details class="sec" data-sec="${esc(section)}"${open ? ' open' : ''}><summary>${esc(section)}</summary>`;
    lastSection = section; lastSub = null;
  }
  if (sub && sub !== lastSub) { navHtml += `<div class="group">${esc(sub)}</div>`; lastSub = sub; }
  navHtml += link(n);
}
if (lastSection !== null) navHtml += '</details>';
const nav = document.getElementById('nav');
nav.innerHTML = navHtml;

// The whole menu: hidden or shown on a wide screen (remembered), opened on demand on a phone.
const btn = document.getElementById('navbtn');
const phone = matchMedia('(max-width: 860px)');
if (store.get('amber-docs-nav-hidden')) document.body.classList.add('nav-hidden');
const shown = () => phone.matches ? document.body.classList.contains('nav-open') : !document.body.classList.contains('nav-hidden');
const sync = () => btn.setAttribute('aria-expanded', String(shown()));
btn.addEventListener('click', () => {
  if (phone.matches) document.body.classList.toggle('nav-open');
  else { document.body.classList.toggle('nav-hidden'); store.set('amber-docs-nav-hidden', document.body.classList.contains('nav-hidden')); }
  sync();
});
phone.addEventListener('change', sync);
nav.addEventListener('click', e => { if (phone.matches && e.target.closest('a')) document.body.classList.remove('nav-open'); });
sync();
function link(n) {
  const a = `<a href="${esc(n.name)}.html" class="${n.current ? 'cur' : ''}">${esc(n.title)}</a>`;
  return a;
}
// Light / dark: light unless this browser chose dark. Pages that draw with JS listen for "amber-theme".
document.getElementById('themebtn').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme !== 'dark';
  if (dark) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem('amber-theme', dark ? 'dark' : 'light'); } catch {}
  document.dispatchEvent(new Event('amber-theme'));
});
// This page's sections, in a column on the right; the one being read is highlighted.
const tocEl = document.getElementById('toc');
if (toc.length > 1) {
  tocEl.innerHTML = '<div class="toc-title">本页目录</div>' + toc.map(h => `<a href="#${esc(h.id)}">${esc(h.textContent)}</a>`).join('');
  const links = [...tocEl.querySelectorAll('a')];
  const spy = () => {
    let i = 0;
    toc.forEach((h, k) => { if (h.getBoundingClientRect().top < 120) i = k; });
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) i = toc.length - 1;
    links.forEach((a, k) => a.classList.toggle('on', k === i));
  };
  addEventListener('scroll', spy, { passive: true });
  spy();
} else document.body.classList.add('no-toc');
if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
</script>
</body>
