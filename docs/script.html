const DATA = {"md":"# 脚本约定\n\n应用的脚本一般由 agent 写。这一页说明脚本和 Amber 之间的约定：输入从哪来、输出怎么写、在什么环境里跑。agent 用的版本在 [skills/amber/SKILL.md](../skills/amber/SKILL.md#把跑通的操作提交成新应用)，内容一致。\n\n## 输入\n\n脚本从**标准输入**读一个 JSON：\n\n```json\n{\n  \"params\": {\"city\": \"北京\", \"repo\": \"group/project\"},\n  \"caller\": {\"unionId\": \"on_…\", \"chatId\": \"oc_…\", \"channel\": \"bot|agent|schedule\", \"city\": \"北京\"},\n  \"runId\": \"…\",\n  \"services\": {\"data-mcp\": {\"tokens\": [\"…\", \"…\"], \"tcpPort\": 8765}},\n  \"secrets\": {\"API_TOKEN\": \"…\"}\n}\n```\n\n| 字段 | 说明 |\n|---|---|\n| `params` | 参数和配置项的值都在这里，脚本不用区分。不要从命令行或环境变量读参数 |\n| `caller` | 执行人：`channel` 是入口（飞书、agent、定时任务），`city` 是执行人的办公城市（有的话） |\n| `runId` | 本次运行的 id |\n| `services` | 只有声明了服务时才有，见下面「调用数据服务」 |\n| `secrets` | 只有声明了密钥时才有，见下面「密钥」 |\n\n## 输出\n\n往**标准输出**打印 Markdown，最多 256KB。除了普通 Markdown 和表格，还支持：\n\n- **图表**：` ```vega-lite ` 代码块。柱状图、折线图、饼图（`mark: arc`，theta 为数值、color 为类别）会转成飞书原生图表；其他图只在网站上显示。\n- **数据表**：` ```table ` 代码块，内容是 `{\"columns\":[{\"name\",\"label\",\"type\":\"text|number\"}],\"rows\":[…],\"total\":N}`。卡片里每张表最多 100 行，完整内容在网站上看。\n- **@ 人或机器人**：正文里写 `@` 加对方在群里的显示名，名字后面空一格或接标点，比如 `有更新，@同步机器人 请拉最新代码`。规则见[主要场景](scenarios.md#5-把结果交给群里的机器人或同事)。\n\n**没有输出就不发消息**。监控类的应用正常时什么都不打印，异常时才输出。\n\n## 运行环境（沙箱）\n\n每次执行都在沙箱里：\n\n| 项目 | 默认 |\n|---|---|\n| 当前目录 | 本次运行的临时目录，也是 `HOME` 和 `TMPDIR`，结束后删除 |\n| 可读 | 系统目录和常见语言工具链（Homebrew、nvm、pyenv 等），外部命令能用；`$HOME` 下的其他文件不可见 |\n| 联网 | 不联网。需要时在 `script` 里写 `\"network\": true`，审核时会重点看 |\n| Python | 系统 Python 3.9，只有标准库 |\n| 时限 | 不写 `timeoutMs` 时用管理员设的默认时限（初始 60 秒）；可以写 `timeoutMs`（毫秒），最多到管理员设的最长时限（初始 10 分钟），超过的提交时就会被拒绝 |\n| 大小 | 代码最多 64KB，输出最多 256KB |\n\n### 用第三方包\n\n在 `script` 里写 `\"interpreter\": \"/opt/homebrew/bin/python3\"`，或某个虚拟环境里的 python（绝对路径），这个解释器装好的包都能用。在执行端上运行时，一般用运行环境里配好的 Python，不用写。\n\n### 访问数据（运行环境）\n\n脚本不写任何路径声明，而是在 `script` 里写 `\"env\": \"执行端名/环境名\"`，选一个已批准的运行环境，能访问的就是那个环境的权限。代码里用 `os.environ[\"WORKDIR\"]` 或绝对路径访问（当前目录仍是临时目录）。\n\n- 从 botmux 机器人导出的环境，和那个机器人在自己沙箱里能访问的一样，lark-cli 用的也是它的飞书身份。\n- agent 用 `amber envs --mine` 找属于自己的环境（来源是 `botmux:\u003c自己的 appId>`）；`amber envs` 列出全部已批准的环境。\n- 不写 `env` 的应用在 Amber 本机运行，看不到任何业务数据。\n- 写了 `env` 的应用不能上架、不能设为全局。\n\n详见[执行端与运行环境](executor.md)和[运行环境定义格式](environment-format.md)。\n\n## 调用数据服务（data-mcp）\n\n> data-mcp 是企业内部的数仓应用，Amber 把它作为可信服务访问：每次调用都带执行人的身份凭证，数仓按执行人的权限返回数据（服务方的做法见[可信身份](identity.md#36-已接入的服务data-mcp)）。\n\n在 `script` 里声明 `\"services\": {\"data-mcp\": {\"calls\": 1}}`（每次执行最多调用几次，1–20）。运行时输入里会有这么多张凭证，**每次请求用一张，不能重复用**。一次查询只要一张。\n\n```text\nPOST http://127.0.0.1:\u003ctcpPort>/amber/query\nAuthorization: Amber \u003ctoken>\nContent-Type: application/json\n\n{\"sql\": \"…\", \"datasource\": \"tchouse-c\"}\n```\n\n- 端口取输入里的 `tcpPort`，不要写死；请求不要走代理。在执行端上运行的应用写法完全一样。\n- 请求体只能有 `sql` 和 `datasource`（可省略），多带任何字段返回 422。\n- 返回 200 时看 `status`：`success` 才算成功，数据在 `rows`（以列名为键的对象数组）、`columns`、`row_count`、`truncated`；`validation_error` 等失败也是 200，原因在 `error_code` 或 `issues[].code`。\n- 401 是凭证无效，409 是凭证已用过，429 是定时执行限流。\n- 试运行最多返回 20 行；`truncated` 为 true 时在输出里说明。\n- 声明了数据服务的应用不能访问外网。\n\n服务方怎么验证凭证见[可信身份](identity.md#36-已接入的服务data-mcp)。\n\n## 密钥\n\n在 `script` 里写 `\"secrets\": [\"API_TOKEN\"]`，只写名字（大写字母、数字、下划线，最多 10 个），脚本从输入的 `secrets` 里取值。值由创建人在私聊卡片或网站上填写，不进代码、不进草稿，agent 也拿不到。不要打印密钥，打印出来也会被遮成 `***`。用到密钥的应用总要人点确认卡才能执行。\n\n## 草稿格式\n\n```json\n{\n  \"chatId\": \"oc_…\", \"chatType\": \"group\", \"claimer\": \"user@example.com\",\n  \"name\": \"注册商户数\", \"description\": \"统计近 N 天每天新注册的商户数\",\n  \"params\": [\n    {\"name\": \"days\", \"label\": \"天数\", \"type\": \"integer\", \"default\": \"7\", \"min\": 1, \"max\": 90},\n    {\"name\": \"repo\", \"label\": \"仓库\", \"type\": \"string\", \"scope\": \"config\"}\n  ],\n  \"script\": {\"kind\": \"script\", \"lang\": \"python\", \"network\": false, \"timeoutMs\": 60000, \"code\": \"…\"},\n  \"options\": {\"confirm\": false, \"schedulable\": true}\n}\n```\n\n| 字段 | 说明 |\n|---|---|\n| `chatType` | `group` 或 `p2p`；私聊必须带 `claimer`，群里也建议带（同名应用靠它判断是谁的新版本） |\n| `originMessageId`、`inThread` | 想让认领卡出现在当前话题里时加 |\n| 参数类型 | `string`（可加 `maxLength`、`pattern`）或 `integer`（可加 `min`、`max`）；`\"defaultFrom\": \"caller.city\"` 表示不填时用执行人的办公城市 |\n| `\"scope\": \"config\"` | 配置项：值由创建人在网站上设置，执行人传不进来；不能用 `defaultFrom`，不要放机密 |\n| `script.kind` | 只能是 `script`；不要写 `sandbox` 字段（会被拒绝） |\n| `script.env`、`script.interpreter`、`script.secrets`、`script.network`、`script.services` | 见上文 |\n| `options.confirm` | 执行前必须确认，会改数据、有风险时打开 |\n| `options.schedulable` | 允许定时执行，不写时默认 `true` |\n\n用同一个名字、在同一个群（或私聊）提交，就是已有应用的新版本。提交用 `amber submit draft.json --label \u003cbot 名>`，见[agent 接入](cli-and-skill.md)。\n","nav":[{"name":"quickstart","title":"快速上手","group":"使用手册/业务开发人员","current":false},{"name":"chat","title":"Amber 机器人对话","group":"使用手册/业务开发人员","current":false},{"name":"with-agent","title":"和自己的 agent 协作","group":"使用手册/业务开发人员","current":false},{"name":"web","title":"网站操作","group":"使用手册/业务开发人员","current":false},{"name":"scenarios","title":"主要场景的实现方式","group":"使用手册/业务开发人员","current":false},{"name":"sharing","title":"应用的分享","group":"使用手册/业务开发人员","current":false},{"name":"faq","title":"常见问题","group":"使用手册/业务开发人员","current":false},{"name":"review","title":"审核指南","group":"使用手册/审核人员","current":false},{"name":"admin","title":"管理员手册","group":"使用手册/系统管理员","current":false},{"name":"install","title":"安装与部署","group":"安装运维","current":false},{"name":"feishu-setup","title":"飞书应用配置","group":"安装运维","current":false},{"name":"executor","title":"执行端与运行环境","group":"安装运维","current":false},{"name":"concepts","title":"概念模型","group":"概念模型与开发参考","current":false},{"name":"script","title":"脚本约定","group":"概念模型与开发参考","current":true},{"name":"cli-and-skill","title":"agent 接入：命令行、skill 与接口","group":"概念模型与开发参考","current":false},{"name":"identity","title":"可信身份","group":"概念模型与开发参考","current":false},{"name":"identity-example","title":"可信身份：完整示例","group":"概念模型与开发参考","current":false},{"name":"environment-format","title":"运行环境定义格式","group":"概念模型与开发参考","current":false},{"name":"usage","title":"使用指南（已拆分）","group":"","current":false}]};
const REPO = 'https://github.com/xu4wang/amber/blob/main/';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Same anchor rule as GitHub, so links written for the repo keep working here.
const slug = t => t.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');

const doc = document.getElementById('doc');
doc.innerHTML = DOMPurify.sanitize(marked.parse(DATA.md));
const names = new Set(DATA.nav.map(n => n.name));
doc.querySelectorAll('a[href]').forEach(a => {
  const h = a.getAttribute('href');
  const m = /^([a-z-]+)\.md(#.*)?$/.exec(h);
  if (m && names.has(m[1])) a.setAttribute('href', m[1] + '.html' + (m[2] || ''));
  else if (/^\.\.\//.test(h)) { a.setAttribute('href', REPO + h.replace(/^\.\.\//, '')); a.target = '_blank'; a.rel = 'noopener'; }
  else if (/^https?:/.test(h)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
});
// Diagrams (assets/*.svg) are inlined so they take the page's light / dark colours.
doc.querySelectorAll('img').forEach(async img => {
  if (!/^assets\/[a-z0-9-]+\.svg$/.test(img.getAttribute('src') || '')) return;
  try {
    const r = await fetch(img.src);
    if (!r.ok) return;
    const box = document.createElement('div');
    box.className = 'diagram';
    box.innerHTML = DOMPurify.sanitize(await r.text(), { USE_PROFILES: { svg: true } });
    const svg = box.querySelector('svg');
    if (!svg) return;
    svg.removeAttribute('width'); svg.removeAttribute('height');
    img.replaceWith(box);
  } catch {}
});
const toc = [];
doc.querySelectorAll('h2, h3').forEach(h => { h.id = slug(h.textContent); if (h.tagName === 'H2') toc.push(h); });
if (typeof hljs === 'object') doc.querySelectorAll('pre code').forEach(c => {
  const lang = (c.className.match(/language-(\w+)/) || [])[1];
  if (lang && hljs.getLanguage(lang)) hljs.highlightElement(c);
});

const cur = DATA.nav.find(n => n.current);
// Nav groups are "section/subgroup"; a page without a group stays out of the nav.
// Each section folds. On every load only the section of the current page is open.
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const curSection = cur && cur.group ? cur.group.split('/')[0] : null;
let navHtml = '', lastSection = null, lastSub = null;
for (const n of DATA.nav) {
  if (!n.group) continue;
  const [section, sub] = n.group.split('/');
  if (section !== lastSection) {
    if (lastSection !== null) navHtml += '</details>';
    const open = section === curSection;
    navHtml += `<details class="sec" data-sec="${esc(section)}"${open ? ' open' : ''}><summary>${esc(section)}</summary>`;
    lastSection = section; lastSub = null;
  }
  if (sub && sub !== lastSub) { navHtml += `<div class="group">${esc(sub)}</div>`; lastSub = sub; }
  navHtml += link(n);
}
if (lastSection !== null) navHtml += '</details>';
const nav = document.getElementById('nav');
nav.innerHTML = navHtml;

// The whole menu: hidden or shown on a wide screen (remembered), opened on demand on a phone.
const btn = document.getElementById('navbtn');
const phone = matchMedia('(max-width: 860px)');
if (store.get('amber-docs-nav-hidden')) document.body.classList.add('nav-hidden');
const shown = () => phone.matches ? document.body.classList.contains('nav-open') : !document.body.classList.contains('nav-hidden');
const sync = () => btn.setAttribute('aria-expanded', String(shown()));
btn.addEventListener('click', () => {
  if (phone.matches) document.body.classList.toggle('nav-open');
  else { document.body.classList.toggle('nav-hidden'); store.set('amber-docs-nav-hidden', document.body.classList.contains('nav-hidden')); }
  sync();
});
phone.addEventListener('change', sync);
nav.addEventListener('click', e => { if (phone.matches && e.target.closest('a')) document.body.classList.remove('nav-open'); });
sync();
function link(n) {
  const a = `<a href="${esc(n.name)}.html" class="${n.current ? 'cur' : ''}">${esc(n.title)}</a>`;
  return a;
}
// Light / dark: light unless this browser chose dark. Pages that draw with JS listen for "amber-theme".
document.getElementById('themebtn').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme !== 'dark';
  if (dark) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem('amber-theme', dark ? 'dark' : 'light'); } catch {}
  document.dispatchEvent(new Event('amber-theme'));
});
// This page's sections, in a column on the right; the one being read is highlighted.
const tocEl = document.getElementById('toc');
if (toc.length > 1) {
  tocEl.innerHTML = '<div class="toc-title">本页目录</div>' + toc.map(h => `<a href="#${esc(h.id)}">${esc(h.textContent)}</a>`).join('');
  const links = [...tocEl.querySelectorAll('a')];
  const spy = () => {
    let i = 0;
    toc.forEach((h, k) => { if (h.getBoundingClientRect().top < 120) i = k; });
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) i = toc.length - 1;
    links.forEach((a, k) => a.classList.toggle('on', k === i));
  };
  addEventListener('scroll', spy, { passive: true });
  spy();
} else document.body.classList.add('no-toc');
if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
</script>
