const DATA = {"md":"# agent 接入：命令行、skill 与接口\n\n日常使用时，人只跟自己的 agent（botmux、Claude Code、cc-connect 等）说话，agent 通过 `amber` 命令行调用 Amber。`amber` 是一个单文件脚本（[`client/amber`](../client/amber)），只依赖 Python 3 标准库。\n\n> **这篇装的是客户端**，每台跑 agent 的机器都要装，不需要部署服务端。Amber 服务端一个组织只部署一套，见 [安装与部署](install.md)。\n\n## 安装\n\n在每台跑 agent 的机器上执行：\n\n```sh\nmkdir -p ~/.local/bin\ncurl -fsSL https://raw.githubusercontent.com/xu4wang/amber/main/client/amber -o ~/.local/bin/amber\nchmod 755 ~/.local/bin/amber\n```\n\n**要确认装的是哪一版**（比如多台机器要保持一致）：把上面地址里的 `main` 换成具体的 commit，按 commit 下载，再算哈希：\n\n```sh\nC=345e22ab743c607e35d57a58c6fd952b101e6931     # 换成你要装的完整 commit\ncurl -fsSL \"https://raw.githubusercontent.com/xu4wang/amber/${C}/client/amber\" -o /tmp/amber.new\nshasum -a 256 /tmp/amber.new\n# 和仓库里同一个 commit 的文件比对（在有仓库的机器上执行）：\ngit show \"${C}:client/amber\" | shasum -a 256\n```\n\n变量要写成 `\"${C}\"` 的形式：macOS 默认的 zsh 会把 `$C:client` 里的 `:c` 当成变量修饰符，得到错误的路径。\n\n升级时也照这个办法：先下载到临时文件、核对哈希，再覆盖。\n\n如果机器上网要走代理，也可以从 Amber 所在的机器用 scp 拷过去。有的机器 `~/.local/bin` 不在 PATH 里，这时用完整路径调用。\n\n**skill**：把 [`skills/amber/SKILL.md`](../skills/amber/SKILL.md) 放到 agent 的 skills 目录下：\n\n| agent | 位置 |\n|---|---|\n| Claude Code（默认配置） | `~/.claude/skills/amber/SKILL.md` |\n| Codex（默认配置） | `~/.codex/skills/amber/SKILL.md` |\n| botmux 里每个 bot 自己的 Claude 配置 | `~/.botmux/bots/\u003cappId>/claude/skills/amber/SKILL.md` |\n| botmux 里每个 bot 自己的 Codex 配置 | `~/.botmux/bots/\u003cappId>/codex/skills/amber/SKILL.md` |\n\n**先确认 bot 实际用的是哪个配置目录，再决定装到哪里。** botmux 里每个 bot 可能是 Claude 也可能是 Codex（看 `~/.botmux/bots.json` 里该 bot 的 `cliId`），也可能没有自己的配置目录、直接用全局配置。判断办法：`~/.botmux/bots/\u003cappId>/claude` 或 `…/codex` 存在并且有配置文件（Codex 是 `config.toml` 或 `auth.json`），才说明这个 bot 用它自己的目录；否则装到全局目录就行，**不要凭空新建一个 bot 专属目录**，建了也不会被加载。\n\nskill 在 agent 开新会话时加载，已经在跑的会话看不到。\n\n**服务地址**：命令行和 skill 里都不写死地址，每台机器装好后配置一次：\n\n```sh\namber config set-url http://amber.example.com    # 写入 ~/.config/amber-client.json\namber info                                        # 检查：显示服务地址、网站地址、本机在 Amber 里的名字\n```\n\n也可以用环境变量 `AMBER_URL`，它的优先级高于配置文件。只有 Amber 配置里 `machines` 列出的 IP 能访问。网站地址由服务端的 `webBaseUrl` 决定，agent 通过 `amber info` 获取，不需要另外配置。\n\n## 命令\n\n```text\namber list                                   这个会话里能用的应用\namber show \u003c应用>                            参数，以及 run 会直接执行还是要确认\namber run \u003c应用> [参数名=值 ...]             执行（或者发确认卡片）\namber wait \u003c请求编号> [--timeout 秒]         等确认卡片的结果（默认最多 600 秒）\namber schedule add \u003c应用> --at \"每天 09:00\" [--tz \u003c时区>] [参数名=值 ...]\namber schedule list\namber schedule pause \u003c编号>                  立即暂停\namber schedule resume \u003c编号>                 恢复，需要创建人在卡片上确认\namber schedule delete \u003c编号>                 删除，需要创建人在卡片上确认\namber submit draft.json                      提交新应用草稿（同名即新版本）\namber retire \u003c应用>                          下线应用，需要创建人或管理员在卡片上确认\namber global \u003c应用>                          设为全局，需要管理员在卡片上确认\namber local \u003c应用>                           取消全局，需要管理员在卡片上确认\namber envs [--mine]                          已批准的运行环境（草稿里 env 写第一列）；--mine 只看从本机器人导出的\namber page publish \u003c目录> [--name 名字]      发布或更新页面应用，必须带 --user；见下面「页面应用」\namber info                                   本机连的 Amber 服务、网站地址\namber config set-url \u003c地址>                  设置本机的 Amber 服务地址\n```\n\n通用选项：\n\n| 选项 | 默认值 | 说明 |\n|---|---|---|\n| `--chat oc_…` | `$BOTMUX_CHAT_ID` | 当前会话（群或私聊） |\n| `--chat-type group\\|p2p` | `$BOTMUX_CHAT_TYPE` | 会话类型 |\n| `--user 邮箱` | 无 | agent 正在为谁工作。**只有这个人能点确认卡片**；私聊里必须填 |\n| `--reply-to om_…` | 话题里取 `$BOTMUX_ROOT_MESSAGE_ID` | 确认卡片发进这个话题 |\n| `--label 名字` | `$AMBER_LABEL` | agent 的名字（用户认识的那个，比如 bot 名），显示在认领卡和确认卡上；不填显示「你的 agent」。机器名只记审计，不显示 |\n| `--json` | 关 | 输出原始 JSON |\n\n退出码：`0` 完成，`1` 出错，`2` 用法错误，`3` 还在等人点卡片。\n\n## 三档行为\n\n接口按 IP 放行，**分不清 agent 背后是哪个人**，所以接口本身从不代表任何人执行。按应用的情况分三档：\n\n| 档位 | 什么时候 | 怎么执行 | 身份 |\n|---|---|---|---|\n| ① 查询 | `list`、`show`、`schedule list`、`wait` | 直接返回 | 不涉及 |\n| ② 直接执行 | 应用不调用任何服务，也没开「执行前确认」 | `amber run` 当场执行，Markdown 直接打印出来 | 记为 `agent:\u003c机器名>`，不签发任何凭证 |\n| ③ 确认卡片 | 应用要调用服务（需要某人的身份）、开了「执行前确认」，或者要创建、恢复、删除定时任务 | Amber 在原来的群或话题里发一张预填好的确认卡片；私聊则发到那个人和 Amber 的私聊。**执行结果只显示在这张卡片上（完整内容在网站），不返回给 agent**：`amber wait` 只告诉你完成、取消还是失败 | **点卡片的人**，身份取自飞书的卡片事件 |\n\n第 ③ 档的典型流程：\n\n```sh\n$ amber run 注册商户数 days=30 --user zhang@example.com\n已在飞书发出确认卡片，等 zhang@example.com 点「执行」。用 amber wait \u003crequest> 查看是否完成；结果只显示在飞书卡片上，不返回给 agent。\nrequest: 4f0c…（完整随机编号）\n# agent 先告诉用户：「请在卡片上点一下」\n$ amber wait 4f0c…\n已执行（以点确认的人的身份）。结果只显示在飞书的确认卡片上（完整内容在 Amber 网站），不会返回给 agent。\n```\n\n为什么不把结果给 agent：这类应用是**以点卡片的人的身份**查数据的，结果属于这个人。确认卡片和请求编号对群里所有人可见，结果如果能通过接口取回，知道编号的人就能读到别人的数据。所以结果只留在飞书卡片和网站（网站只给本人看自己的运行记录）。 运行编号和请求编号都是完整的随机串；按运行编号读结果的接口 `/v1/runs/` 已关闭（返回 410）。\n\n确认卡片 24 小时内有效，只能处理一次，重复点击无效。点「取消」或过期时，`wait` 会说明原因。每个会话 10 分钟内最多发 10 张确认卡片，防止 agent 刷屏。\n\n## 定时任务\n\n- 只有审核时打开了 `schedulable` 的应用可以定时。草稿里不写 `schedulable` 时默认打开（会显示在认领卡和审核文档上）。\n- 时间写法：`每天 09:00`、`工作日 09:00`、`每周一 09:00`、`每小时`、`每 2 小时`、`每 2 小时 15 分`、`每 5 分钟`（分钟间隔只能是 5、10、15、20、30，最短 5 分钟），英文写法 `daily 9:00` / `weekdays 9:00` / `weekly mon 9:00` / `every 2h` / `every 15m` 也可以。不加 `--tz` 时用 Amber 服务器配置的默认时区（见安装文档里的 `timezones`），需要时用 `--tz` 指定其他 IANA 时区。\n- 人在卡片上点了「创建定时任务」才生效，之后每次都以**创建人**的身份执行，结果发到原来的群、话题或私聊。\n- **脚本没有输出就不发消息**。所以监控类的需求应该写成：正常时什么都不打印，出问题时才输出。\n- 失败只私聊通知创建人，连续失败 3 次自动暂停。以下情况也会自动暂停并私聊通知创建人：应用下线、换了新版本、不再允许定时，或者创建人已经不在群里（群成员名单缓存 10 分钟，创建人退群后最多约 10 分钟内任务仍可能按其身份运行）。\n- 每个会话最多 20 个定时任务，全局最多同时运行 2 个。Amber 停机期间错过的运行不会补跑。\n\n## 提交新应用\n\n草稿格式和脚本约定见[脚本约定](script.md)（agent 用的版本在 [skills/amber/SKILL.md](../skills/amber/SKILL.md#把跑通的操作提交成新应用)）。每次都一样的值用配置项（参数加 `\"scope\": \"config\"`），由人在网站上设置；需要 token、密码的应用在 `script.secrets` 里声明密钥名字；值由人在私聊或网站上填写，agent 拿不到（见[主要场景](scenarios.md#3-需要外部系统的-token密码)和[常见问题](faq.md)）。\n\n**修改已有应用**：在同一个会话里用同一个名字提交草稿，就是这个应用的新版本。认领卡和审核文档会附上和当前版本的代码差异；新版本只能由原创建人认领；同一个应用同时只能有一个版本在认领或审核中。审核通过后旧版本自动下线，挂在旧版本上的定时任务暂停，并私聊创建人确认换绑。提交后，由人在认领卡上试运行、提交审核，审核人在飞书审批里同意后应用生效。agent 不能认领或审核。\n\n## 页面应用\n\n用户要一个能交互的网页（查数、看图表、写飞书）时，agent 写一个目录发布成[页面应用](pages.md)：\n\n```bash\namber page publish ./shanghu --name shanghu --user zhangsan@example.com\n```\n\n- 目录里要有 `index.html`；`amber.json` 写明页面会调用哪些应用：`{\"apps\": [\"注册商户数\"]}`。点开头的文件和 `node_modules` 不会上传。最多 200 个文件、共 10MB\n- `--name` 是页面名：小写字母、数字和 `-`，以字母或数字开头，最多 40 个字符；不填就用目录名（转成小写）\n- 第一次发布，或者 `amber.json` 里的应用变了，会在会话里发确认卡片（附页面首屏截图），`--user` 那个人点「确认发布」后生效；命令返回 `awaiting`。只改页面内容直接生效，返回 `updated`，告诉用户刷新页面\n- 页面里怎么调用应用（`Amber.run`、`Amber.render` 等）见[页面应用](pages.md#给写页面的-agent)\n\n## 接口（给不想用命令行的 agent）\n\n所有接口都在 `/v1/` 下，只放行白名单 IP。除标注 GET 的以外都是 POST，请求体为 JSON。会话上下文字段是 `chatId`、`chatType`、`user`、`replyTo`、`inThread`、`label`。\n\n| 方法 | 路径 | 请求体（除上下文外） |\n|---|---|---|\n| POST | `/v1/commands/list` | 无 |\n| POST | `/v1/commands/show` | `command` |\n| POST | `/v1/runs` | `command`、`args` |\n| GET | `/v1/requests/\u003c请求编号>?wait=秒` | 无（最多等 50 秒） |\n| POST | `/v1/schedules` | `command`、`args`、`at`、`tz` |\n| POST | `/v1/schedules/list` | 无 |\n| POST | `/v1/schedules/\u003c编号>/pause\\|resume\\|delete` | 无 |\n| POST | `/v1/commands/retire` | `command` |\n| POST | `/v1/commands/scope` | `command`、`global`（true 设为全局，false 取消全局） |\n| POST | `/v1/drafts` | 草稿 JSON |\n| POST | `/v1/pages` | `name`、`files`（`[{\"path\": \"index.html\", \"data\": \"\u003cbase64>\"}, …]`），必须带 `user`；请求体最大 16MB |\n| GET | `/v1/info` | 无，返回网站地址 `webUrl` 和本机名字 |\n| GET | `/v1/keys` | 无，返回公钥，见 [identity.md](identity.md) |\n","nav":[{"name":"quickstart","title":"快速上手","group":"使用手册/业务开发人员","current":false},{"name":"chat","title":"Amber 机器人对话","group":"使用手册/业务开发人员","current":false},{"name":"with-agent","title":"和自己的 agent 协作","group":"使用手册/业务开发人员","current":false},{"name":"web","title":"网站操作","group":"使用手册/业务开发人员","current":false},{"name":"scenarios","title":"主要场景的实现方式","group":"使用手册/业务开发人员","current":false},{"name":"pages","title":"页面应用","group":"使用手册/业务开发人员","current":false},{"name":"sharing","title":"应用的分享","group":"使用手册/业务开发人员","current":false},{"name":"faq","title":"常见问题","group":"使用手册/业务开发人员","current":false},{"name":"review","title":"审核指南","group":"使用手册/审核人员","current":false},{"name":"admin","title":"管理员手册","group":"使用手册/系统管理员","current":false},{"name":"install","title":"安装与部署","group":"安装运维","current":false},{"name":"feishu-setup","title":"飞书应用配置","group":"安装运维","current":false},{"name":"executor","title":"执行端与运行环境","group":"安装运维","current":false},{"name":"concepts","title":"概念模型","group":"概念模型与开发参考","current":false},{"name":"script","title":"脚本约定","group":"概念模型与开发参考","current":false},{"name":"cli-and-skill","title":"agent 接入：命令行、skill 与接口","group":"概念模型与开发参考","current":true},{"name":"identity","title":"可信身份","group":"概念模型与开发参考","current":false},{"name":"identity-example","title":"可信身份：完整示例","group":"概念模型与开发参考","current":false},{"name":"environment-format","title":"运行环境定义格式","group":"概念模型与开发参考","current":false},{"name":"usage","title":"使用指南（已拆分）","group":"","current":false}]};
const REPO = 'https://github.com/xu4wang/amber/blob/main/';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Same anchor rule as GitHub, so links written for the repo keep working here.
const slug = t => t.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');

const doc = document.getElementById('doc');
doc.innerHTML = DOMPurify.sanitize(marked.parse(DATA.md));
const names = new Set(DATA.nav.map(n => n.name));
doc.querySelectorAll('a[href]').forEach(a => {
  const h = a.getAttribute('href');
  const m = /^([a-z-]+)\.md(#.*)?$/.exec(h);
  if (m && names.has(m[1])) a.setAttribute('href', m[1] + '.html' + (m[2] || ''));
  else if (/^\.\.\//.test(h)) { a.setAttribute('href', REPO + h.replace(/^\.\.\//, '')); a.target = '_blank'; a.rel = 'noopener'; }
  else if (/^https?:/.test(h)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
});
// Diagrams (assets/*.svg) are inlined so they take the page's light / dark colours.
doc.querySelectorAll('img').forEach(async img => {
  if (!/^assets\/[a-z0-9-]+\.svg$/.test(img.getAttribute('src') || '')) return;
  try {
    const r = await fetch(img.src);
    if (!r.ok) return;
    const box = document.createElement('div');
    box.className = 'diagram';
    box.innerHTML = DOMPurify.sanitize(await r.text(), { USE_PROFILES: { svg: true } });
    const svg = box.querySelector('svg');
    if (!svg) return;
    svg.removeAttribute('width'); svg.removeAttribute('height');
    img.replaceWith(box);
  } catch {}
});
const toc = [];
doc.querySelectorAll('h2, h3').forEach(h => { h.id = slug(h.textContent); if (h.tagName === 'H2') toc.push(h); });
if (typeof hljs === 'object') doc.querySelectorAll('pre code').forEach(c => {
  const lang = (c.className.match(/language-(\w+)/) || [])[1];
  if (lang && hljs.getLanguage(lang)) hljs.highlightElement(c);
});

const cur = DATA.nav.find(n => n.current);
// Nav groups are "section/subgroup"; a page without a group stays out of the nav.
// Each section folds. On every load only the section of the current page is open.
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const curSection = cur && cur.group ? cur.group.split('/')[0] : null;
let navHtml = '', lastSection = null, lastSub = null;
for (const n of DATA.nav) {
  if (!n.group) continue;
  const [section, sub] = n.group.split('/');
  if (section !== lastSection) {
    if (lastSection !== null) navHtml += '</details>';
    const open = section === curSection;
    navHtml += `<details class="sec" data-sec="${esc(section)}"${open ? ' open' : ''}><summary>${esc(section)}</summary>`;
    lastSection = section; lastSub = null;
  }
  if (sub && sub !== lastSub) { navHtml += `<div class="group">${esc(sub)}</div>`; lastSub = sub; }
  navHtml += link(n);
}
if (lastSection !== null) navHtml += '</details>';
const nav = document.getElementById('nav');
nav.innerHTML = navHtml;

// The whole menu: hidden or shown on a wide screen (remembered), opened on demand on a phone.
const btn = document.getElementById('navbtn');
const phone = matchMedia('(max-width: 860px)');
if (store.get('amber-docs-nav-hidden')) document.body.classList.add('nav-hidden');
const shown = () => phone.matches ? document.body.classList.contains('nav-open') : !document.body.classList.contains('nav-hidden');
const sync = () => btn.setAttribute('aria-expanded', String(shown()));
btn.addEventListener('click', () => {
  if (phone.matches) document.body.classList.toggle('nav-open');
  else { document.body.classList.toggle('nav-hidden'); store.set('amber-docs-nav-hidden', document.body.classList.contains('nav-hidden')); }
  sync();
});
phone.addEventListener('change', sync);
nav.addEventListener('click', e => { if (phone.matches && e.target.closest('a')) document.body.classList.remove('nav-open'); });
sync();
function link(n) {
  const a = `<a href="${esc(n.name)}.html" class="${n.current ? 'cur' : ''}">${esc(n.title)}</a>`;
  return a;
}
// Light / dark: light unless this browser chose dark. Pages that draw with JS listen for "amber-theme".
document.getElementById('themebtn').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme !== 'dark';
  if (dark) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem('amber-theme', dark ? 'dark' : 'light'); } catch {}
  document.dispatchEvent(new Event('amber-theme'));
});
// This page's sections, in a column on the right; the one being read is highlighted.
const tocEl = document.getElementById('toc');
if (toc.length > 1) {
  tocEl.innerHTML = '<div class="toc-title">本页目录</div>' + toc.map(h => `<a href="#${esc(h.id)}">${esc(h.textContent)}</a>`).join('');
  const links = [...tocEl.querySelectorAll('a')];
  const spy = () => {
    let i = 0;
    toc.forEach((h, k) => { if (h.getBoundingClientRect().top < 120) i = k; });
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) i = toc.length - 1;
    links.forEach((a, k) => a.classList.toggle('on', k === i));
  };
  addEventListener('scroll', spy, { passive: true });
  spy();
} else document.body.classList.add('no-toc');
if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
</script>
