:root {

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.75 "PingFang SC", "Noto Sans SC", system-ui, sans-serif; }

header .back:hover { color: var(--accent); }

<script>
const DATA = {"md":"# 使用指南\n\nAmber 能把你和 AI 助手（agent）一起跑通的一次操作，固化成一个**应用**。以后随时一键执行，执行时不再经过 AI，每次结果都可预期。\n\n本文写给使用 Amber 的人，不需要任何技术背景。想先看操作演示，可以看[视频手册](https://xu4wang.github.io/amber-manual/)，按章节观看，每章 1 分钟左右。\n\n## 1. 几个概念\n\n| 概念 | 说明 |\n|---|---|\n| 应用 | 一段审核过的脚本，加上它需要的参数，比如「天气」带一个「城市」参数。应用只能由审核通过的那一版代码执行，代码一改就要重新审核 |\n| 范围 | 应用属于创建它的人，建在哪个群或私聊就在哪里用：**只有创建人自己看得见、能执行**，群里其他人看不到。别人要用，等它上架 Amber Store 后安装自己的一份。管理员可以看到所有应用（查看代码、设置、下线），但不能执行别人的应用；管理员把应用设为「全局」后，所有人在所有地方都能用。结果卡、定时任务的报告照样发在群里 |\n| 定时任务 | 让一个应用按时间自动执行，比如「工作日 09:00」。每次都以创建人的身份执行 |\n| 执行身份 | 应用总是以「点按钮的那个人」的身份执行。查数据时，你能看到的就是你本人有权限看的数据 |\n| 配置项 | 不用每次执行都填的参数，比如要检查的仓库、通知的机器人。**名字和类型**随代码一起审核；**值**由创建人或管理员在网站上设置一次，以后每次执行（包括定时任务）都自动带上，执行的人不能临时改。值不保密，看得到这个应用的人都能看到 |\n| 密钥 | 应用运行时需要的凭证，比如某个系统的 API token、服务账号密码，相当于部署生产系统时配置的环境变量。**名字**随代码一起审核；**值**由创建人或管理员在私聊或网站上填写，加密保存，只交给这个应用，设置后谁都不能再查看 |\n\n### 创建人、管理员、审核人\n\n三种角色互相独立：管理员不一定是审核人，审核人也不一定是管理员；同一个人可以兼任。管理员和审核人名单由部署方写在 Amber 配置里。\n\n| | 创建人 | 管理员 | 审核人 |\n|---|---|---|---|\n| 是谁 | 认领应用的人（定时任务则是创建它的人） | 配置里的 `admins` | 配置里的 `reviewers` |\n| 让应用上线 | — | 不能单独决定 | **全部审核人都在飞书审批里同意**，应用才生效；少一个人同意都不行 |\n| 认领新版本 | 只能认领自己应用的新版本 | 也只能认领自己应用的新版本（认领了就成了创建人，会用上原创建人的密钥和配置项） | — |\n| 下线应用 | 自己的应用 | 任何应用 | — |\n| 重新分配 | — | 创建人已不在群里的应用：在网站上交给群里的另一个人，对方确认接收后成为创建人 | — |\n| 全局 / 本地 | — | 对 agent 说「把 应用名 设为全局 / 取消全局」后点确认卡；或在飞书里对 Amber 说「全局 应用名」「取消全局 应用名」，「所有应用」查看全部 | — |\n| 管理定时任务 | 自己创建的（暂停、恢复、删除、立即运行） | 任何定时任务的暂停、恢复、删除（不能立即运行别人的） | — |\n\n简单说：**审核人决定代码能不能上线，管理员负责上线之后的管理**。管理员不能跳过审核让应用生效，审核人也不能下线别人的应用。\n\n## 2. 把一次操作固化成应用\n\n1. 在飞书里和你的 agent 把事情做成，比如「查一下近 7 天的注册商户数并画图」。\n2. 对 agent 说：「**把刚才这个存进 Amber，叫『注册商户数』**」。可以顺便说明哪些地方要做成参数，比如「天数可以改」。应用**默认允许定时执行**，不需要的话跟 agent 说「不要定时」。\n   - 应用名就是应用的身份：以后用**同一个名字**提交就是新版本；换个名字就是另一个新应用（Amber 没有「改名」，旧应用需要单独下线）。\n3. Amber 会在当前的群或私聊里发一张**认领卡**（在话题里提交的就回到这个话题，并 @ 让 agent 固化的人）。认领卡上有代码和说明：\n   - 点「**试运行**」，Amber 会以你的身份真实执行一次。有参数的话，先在卡片上填好。\n   - 结果没问题就点「**提交审核**」。认领的人就是这个应用的创建人。\n   - 不认识、不需要的草稿，直接点「**丢弃**」。\n4. 审核人会在飞书「审批」里收到待办，在飞书知识库里能看到完整代码和试运行结果。**所有审核人都同意**后，应用生效，认领卡也会变成「已生效」。\n\n## 3. 执行应用\n\n### 在飞书里\n\n- 私聊 Amber，或者在群里 @Amber，发「**帮助**」，会列出这里能用的应用，点「选择」后填参数执行。\n- 直接发应用名和参数也可以，比如「天气 上海」。\n- 结果会直接更新在卡片上：表格显示成表格（卡片里每张表最多 100 行，完整内容在网站上看），折线图、柱状图、饼图显示成飞书图表，并标出数值。\n- 标着「**需确认**」的应用会改数据或有风险，一定要从表单里点红色的「确认执行」才会执行。\n\n### 让 agent 帮你执行\n\n直接跟你的 agent 说「帮我跑一下注册商户数，最近 30 天」：\n\n- 不涉及个人权限的应用，agent 会直接执行，再把结果告诉你。\n- 需要用你的身份，或者需要确认的应用，Amber 会在当前对话里发一张**确认卡片**。你点「执行」之后才会执行，**结果只显示在这张卡片上**（完整内容在网站「最近运行」里），**不会交给 agent**：这是以你的身份查出来的数据，只给你看。agent 只知道执行完成了，所以想就结果继续问，请直接看卡片。\n- agent 指明了被请求人时（通常如此），只有这个人能点，别人点会被拒绝。agent 没有指明时，群里谁点都可以，**谁点就以谁的身份执行**，所以不是你发起的请求不要点。\n\n### 在网站上\n\n1. 登录：在群里 @Amber 发「**登录**」（或直接私聊 Amber 发），Amber 会把登录卡片发到你和 Amber 的**私聊**里，点卡片上的「打开 Amber 网站」。这个链接 5 分钟内有效、只能用一次，**不要转发给别人**。\n2. 左边是应用树，按「我的私聊 / 各个群 / 全局应用」分组。选中一个应用后：\n   - 「执行」页：填参数后执行，结果显示在下方。\n   - 「定时」页：创建定时任务。审核时没有允许定时的应用，这一页会说明原因和开启方法。\n   - 「代码」页：查看审核通过、实际在运行的代码、第几版和历史版本，以及审核文档链接。\n   - 页面底部的「配置项」：有配置项的应用会列出每一项的当前值；你是创建人（或管理员）时，可以在这里设置或清除。配置项只能在网站上设置，飞书里没有入口。\n   - 页面底部的「密钥」：需要密钥的应用会列出密钥名字和是否已设置；你是创建人（或管理员）时，可以在这里填写、覆盖或删除（只显示末尾 4 位，看不到原值）。\n   - 页面底部的「管理」：你是创建人（或管理员）时，可以在这里下线应用。\n   - 结果里的图表在网站上也会标出数值：折线和柱状图标在每个点、每根柱子上，饼图用引导线标出「类别，占比 / 数值」。\n3. 「最近运行」里有你在所有渠道（飞书、网站、agent、定时）的执行记录，可以随时回看输出。\n4. 不用时点右上角「退出」。如果怀疑别人用了你的登录，在飞书私聊 Amber 发「**退出网站**」，所有浏览器里的登录都会失效。\n\n## 4. 定时任务\n\n- 只有审核时允许定时的应用才能定时执行（新提交的应用默认允许）。\n- 两种创建方式：在网站上应用的「定时」页填写；或者对 agent 说「每个工作日早上 9 点帮我跑一下注册商户数」，然后点它发来的确认卡片。\n- 时间写法：\n\n| 写法 | 例子 |\n|---|---|\n| 每天、工作日、每周几的固定时间 | 每天 09:00、工作日 18:30、每周一 08:45 |\n| 每隔几小时 | 每小时、每 2 小时、每 2 小时 15 分 |\n| 每隔几分钟（最短 5 分钟） | 每 5 分钟、每 15 分钟、每 30 分钟 |\n\n- 时间按 Amber 服务器设定的时区计算，可以选的时区以网站上的下拉框为准。确认卡片和网站上都会写明是哪个时区。\n- 结果发到飞书：群应用发到原来的群或话题，私聊和全局应用发到你和 Amber 的私聊。**脚本没有输出时不发消息**，所以「有异常才提醒」这类监控，正常时就不会打扰你。\n- 结果里可以 @ 群里的人或机器人，把事情交给对方继续处理，见下面的「在结果里 @ 人或机器人」。\n- 失败时只私聊通知创建人。连续失败 3 次会自动暂停。应用下线、换了新版本、你退出了那个群时，定时任务也会自动暂停（退群的判断有最长约 10 分钟延迟，见下面的问答）。应用只有创建人能执行，所以别人不能接手。\n- 在网站上可以暂停、恢复、立即运行一次或删除自己的定时任务。在飞书里 @Amber 发「定时任务」也能看到列表。\n\n### 在结果里 @ 人或机器人\n\n脚本输出的正文里写 `@名字`，名字和本群某个成员（人或机器人）在群里的显示名完全一样时，Amber 发结果卡时会把它换成真正的 @。被 @ 的人会收到提醒，被 @ 的机器人（比如 botmux 的机器人）会被唤起，接着处理。例如每天检查代码仓库，有更新时输出：\n\n```\n仓库有 3 个新提交。@同步机器人 请拉取最新代码并重新部署。\n```\n\n- 应用不用另外声明，审核时看代码就能知道它会 @ 谁。\n- 只在群里的正式运行生效：手动执行、agent 发起后由人确认的执行、定时任务。试运行和私聊只显示文字。\n- 名字后面要空一格，或者接标点、换行：`@张三 请看`、`@张三，请看` 会 @，`@张三请看` 不会（Amber 分不清名字在哪里结束）。\n- `@所有人` 不生效；群里有两个同名成员、对方不在群里、写的不是完整的名字时都不 @，只显示文字。群太大（超过 5000 人）、Amber 取不全成员列表时也不 @。\n- 一次运行最多 @ 5 个不同的成员。表格（` ```table `）和图表里的 @ 不生效。\n- 机器人看到的发送者是 Amber，不是任何人，所以需要人员身份的操作它做不了。把要它做的事在正文里写清楚。\n\n## 5. Amber Store：把好用的应用分享给别人\n\n> 应用有四种分享方式（复制给同群的人、上架到 Store、全局应用、重新分配），它们的区别和怎么选见 **[应用的分享](sharing.md)**。下面是 Store 的详细说明。\n\n应用只有创建人自己能看见、能执行。想让别人也用上，就把它**上架**到 Amber Store，别人在网站上**安装**自己的一份。\n\n**上架**（创建人）\n1. 在网站上打开自己的应用，页面底部「Amber Store」里点「申请上架」。\n2. 审核人在飞书审批里审核一次（标题「Amber 上架」）。除了平常的审核，还会看代码里有没有写死只适用于某个群或某个人的内容：这类内容要先改成配置项，否则别人装了也用不了。\n3. 通过后会私聊通知你。你的这个应用就是 Store 里这个应用的「原版」，照常使用，标「已上架」。\n\n在执行端环境里运行的应用（写了 `env`）暂时不能上架；从 Store 装来的应用也不能再上架。\n\n**安装**（任何人）\n1. 网站左边「Amber Store」里选一个应用，可以看说明、执行时要填什么、需要哪些配置项和密钥、能做什么、完整代码和审核文档。\n2. 选装到哪里（你所在、并且 Amber 也在的群，或你和 Amber 的私聊），起个名字，点「安装」。**不需要审批**，代码在上架时已经审核过。\n3. 装好的是你自己的一个应用：只有你能看见、能执行，以你的身份和数据权限执行。配置项和密钥要你自己设置（应用页面底部），和原版、和别人装的都互不相干。\n4. 同一个地方可以装多份，名字不能重复。\n\n**升级**\n- 原版在原来的群里提交同名新版本、审核通过后，这个版本也就是 Store 里的新版本（审核文档会注明「已上架」）。装了它的人会收到私聊通知。\n- **不会自动升级**。在网站上打开你装的应用，页面底部「Amber Store」里点「查看改动」，可以看到代码差异，以及新增的配置项和密钥；确认后点「升级」。\n- 升级后配置项、密钥、定时任务都跟着走；新版本多了必填的配置项或密钥时，补填之前不能执行。新版本不再允许定时的，定时任务会暂停。\n\n**原版下线了怎么办**\n- 下线原版时可以选：应用**留在 Store**（别人照常可以安装，但不会再有新版本），或者**同时下架**（只有维护人或管理员能这样选）。在飞书里下线时默认留在 Store。\n- 要接着开发：维护人或管理员在应用页面用**开发模式安装**，装进一个群。这一份就成为新的原版，你成为维护人；以后在那个群里用同一个名字提交新版本，就是 Store 里的新版本。原版还有新版本在审核中时不能这样做。\n- 管理员可以在应用页面**更换维护人**（填邮箱），新的维护人就可以下架、重新上架、用开发模式安装。\n\n**卸载和下架**\n- 卸载：在自己装的应用页面点「下线这个应用」，配置项和密钥一起删除。\n- 下架：维护人（原版的创建人）或管理员在应用页面点「下架」。下架后不能再新装，已经装好的照常可用，原版的新版本也不再进入 Store。需要时维护人或管理员可以「重新上架」（版本都审核过，不再审批）。\n\n### 复制给同群的人\n\n除了上架到 Store，还可以把自己的群应用直接**复制一份**给同一个群里的某个人。这样就不用上架，在执行端环境里运行的应用（暂时不能上架）也可以用这种方式分享。\n\n1. 在网站上打开自己的应用，页面底部「复制给群成员」里选一个人，点「发送」。\n2. 对方在飞书上收到确认卡，可以改个名字，点「接收」。不需要审批：代码就是审核过的那一份。\n3. 接收后，那一份就是对方自己的应用：只有他能执行，以他的身份和数据权限执行。配置项的值会复制过去，他可以自己改；**密钥不复制**，要他填自己的；定时任务也不复制。\n4. 之后两份各管各的：对方可以自己提交新版本（照常审核），也可以下线；你的应用出新版本，他的那份不会跟着变。\n\n在执行端环境里运行的应用，复制出来的那份也在原来的环境里运行，只能执行审核过的这段代码。从 Store 装的应用不能复制，对方可以自己去 Store 安装。\n\n## 6. 操作速查\n\n**所有操作都跟你的 agent 说就行**，由 agent 在底层调用 Amber。下面每一项都给出可以直接照抄的说法。Amber 只在两个地方出现：一是它发出的**卡片**，凡是要以你的身份做的事（认领、执行、建定时、下线等）都要你本人点一下，这是身份安全的底线，agent 替不了；二是**登录网站**，登录链接只发在你和 Amber 的私聊里，所以要直接私聊 Amber 发「登录」。\n\n### 应用\n\n| 操作 | 怎么做 | 谁能做 | 要不要点卡片 |\n|---|---|---|---|\n| 新增 | 先和 agent 把事情跑通，再说：「**把刚才这个存进 Amber，叫『注册商户数』，天数做成参数**」。在认领卡上点「试运行」→「提交审核」，等全部审核人同意 | 任何人可以认领 | 要：认领卡上试运行、提交审核 |\n| 修改 | 在**原来的群或私聊**里对 agent 说：「**把『注册商户数』改成按城市分组，用同一个名字提交新版本**」。认领卡会标「新版本」并列出代码差异，同样要试运行、审核 | 只有原创建人能认领新版本 | 要：和新增一样走认领和审核；审核通过前线上一直是旧版本 |\n| 下线 | 对 agent 说：「**下线应用 注册商户数**」，然后在 Amber 发来的确认卡上点「确认下线」。也可以在网站应用页底部点「下线这个应用」 | 创建人或管理员 | 要：创建人或管理员点「确认下线」。不需要审核 |\n| 设置密钥 | 私聊 Amber 发「**设置密钥 注册商户数**」，在 Amber 发来的卡片上填写；新应用在认领卡上点「设置密钥」，Amber 会私聊你填写。也可以在网站应用页的「密钥」一栏设置或删除 | 创建人或管理员；还没认领的新草稿：能认领它的人 | 不用确认卡，但**只能在你和 Amber 的私聊里填写** |\n| 设为全局 / 取消全局 | 对 agent 说：「**把注册商户数设为全局**」或「**取消注册商户数的全局**」，然后在确认卡上点确认。全局应用在 Amber 所在的任何群和私聊都能用，密钥和配置项所有执行人共用一份；在执行端环境里运行的应用（写了 env）不能设为全局 | 管理员 | 要：管理员点确认 |\n\n- 应用名就是应用的身份：用**同一个名字**提交是新版本；换个名字就是另一个新应用。Amber 没有「改名」，旧名字的应用要单独下线。同一个群里几个人各有一个同名应用时（比如复制来的），按认领人判断是谁的那个的新版本，所以提交时要带上认领人。\n- 修改审核通过后，挂在旧版本上的定时任务会先暂停，Amber 私聊创建人一张卡片，点「**换绑到新版本**」就继续运行，时间和参数不变。\n- 下线后应用不能再执行，它的定时任务会暂停并通知创建人；它的密钥也会一起删除。\n- **不要把密钥发给 agent，也不要贴在群里**。agent 提交需要密钥的应用时只写密钥的名字，值由你在私聊卡片或网站上填写。\n\n### 定时任务\n\n| 操作 | 怎么做 | 谁能做 | 要不要点卡片 |\n|---|---|---|---|\n| 创建 | 对 agent 说：「**每个工作日早上 9 点帮我跑一下注册商户数，天数 7**」，然后点确认卡上的「创建定时任务」。也可以在网站应用页的「定时」页填写 | 能执行这个应用的人（应用的创建人；全局应用是所有人）；**点卡片的人就是定时任务的创建人**，以后都以他的身份运行 | 要 |\n| 查看 | 对 agent 说：「**这里有哪些定时任务**」。网站上也有列表 | 每个人只看到自己建的；管理员在网站上能看到全部 | 不用 |\n| 暂停 | 对 agent 说：「**暂停定时任务 注册商户数**」 | 创建人或管理员 | 不用，**立即生效** |\n| 恢复 | 对 agent 说：「**恢复定时任务 注册商户数**」，然后在确认卡上点确认 | 创建人或管理员 | 要 |\n| 删除（下线） | 对 agent 说：「**删除定时任务 注册商户数**」，然后在确认卡上点确认 | 创建人或管理员 | 要；删除后不能恢复 |\n| 修改时间或参数 | **Amber 没有「修改定时任务」**。先删除，再按新的时间和参数重新创建 | 删除：创建人或管理员；重建：重建的人成为新的创建人 | 要（删除、创建各一次） |\n\n- 在群里操作群应用、群定时任务的卡片，**必须在原来那个群里点**。\n- 习惯直接找 Amber 也可以：私聊或在群里 @Amber 发「帮助」「定时任务」「下线 应用名」，效果一样。\n- 退群判断有最长约 10 分钟延迟，见下面「常见问题」里的说明。退群前想让任务马上停，先「暂停」。\n\n## 7. 常见问题\n\n**为什么要认领和审核？**\n应用是 AI 写的代码，可能会改数据，也可能会访问外部系统。认领确保有人对它负责；审核确保有人看过代码。审核通过后代码就锁定了，以后每次执行跑的都是同一份代码。\n\n**群里建的应用，群里其他人能用吗？用谁的身份？**\n不能。应用只有创建人自己看得见、能执行，群里其他人看不到，管理员也只能查看、不能执行。别人要用同样的功能，等它上架 Amber Store 后安装自己的一份，填自己的配置项和密钥；全局应用除外，所有人都能用。\n应用总是以「执行的那个人」的身份执行：在群里 @Amber 用卡片执行，就是发消息或点卡片的人；agent 发起的，就是点确认卡片的人。全局应用被不同的人执行时，看到的是各自有权限的数据。\n\n**为什么有时要点确认卡片，有时不用？怎么判断一个应用需不需要身份？**\nagent 没法向 Amber 证明它是在替谁做事，所以需要身份的应用必须由你本人在飞书里点一下。判断规则是固定的，不靠人或 agent 判断：应用**声明了要调用的服务**（需要可信身份的后端服务，比如按你的权限查数据的服务），或者**开了「执行前确认」**，就需要身份；两条都不满足的（比如查天气），agent 可以直接执行，执行身份记为 agent。这两项写在应用定义里，随代码一起审核，agent 改不了。\n\n**应用调用后端服务时，服务拿到的是谁的身份？可信吗？**\n是执行人本人的身份（飞书 union_id），而且只来自飞书：发消息、点卡片或网站登录的那个人。Amber 每次执行都给声明的服务签发一张短时效的签名凭证，服务方用 Amber 的公钥验签，就能确认「是谁、在执行哪个审核过的应用」；agent、脚本、请求内容都改不了这个身份。所以同一个应用由不同的人执行，服务会按各自的权限返回。声明了服务的脚本不能访问外网，查到的数据无法外传。服务方怎么接入见[可信身份](identity.md)。\n\n**确认卡片别人能点吗？**\nagent 指明了是替谁发起的（通常如此），就只有这个人能点，别人点会被拒绝。agent 没有指明时，群里谁点都可以，谁点就以谁的身份执行，所以不是你发起的请求不要点。\n\n**卡片上写的「你的 agent」是谁？**\n是帮你提交或发起请求的 AI 助手。agent 没报名字时就显示「你的 agent」。\n\n**我看不到某个群里的应用？**\n网站只显示你自己建的应用（在你所在的群和你的私聊里）和全局应用，别人建的应用看不到。如果是你自己建的、你也确实在群里却看不到，请联系管理员确认 Amber 有读取群成员的权限。\n\n**应用想改怎么办？改版本要审核吗？**\n要，和新建应用走完全一样的流程（认领、试运行、飞书审批、所有审核人同意）。审核通过之前，线上一直跑旧版本。跟 agent 说要改什么，它会用同一个名字提交新版本。认领卡和审核文档里会标明「新版本」，并列出和当前版本的代码差异。新版本只能由原创建人（或管理员）认领，审核通过后自动替换旧版本。挂在旧版本上的定时任务会先暂停，Amber 私聊创建人一张卡片，点「换绑到新版本」就会继续运行，参数和时间都不变。\n\n**不需要的应用怎么下线？下线要审核吗？**\n不需要审核：下线只会减少能力，发现应用有问题时要能马上停掉。但只有创建人或管理员能下线，每次都写审计。最简单是对你的 agent 说「下线应用 应用名」，Amber 发来确认卡，创建人或管理员点「确认下线」才生效。也可以在网站应用页面底部点「下线这个应用」，或在飞书里对 Amber 说「下线 应用名」（这种方式的确认卡 5 分钟内有效）。下线后不能再执行，它的定时任务会暂停并通知创建人。\n\n**定时任务按哪个时区？**\n按 Amber 服务器配置的默认时区，确认卡片和网站上都会写成「每天 09:00（北京时间）」这样。网站上创建时可以从下拉框选其他时区。\n\n**定时任务的创建人退群或离职了怎么办？**\n到下一次该运行时，Amber 发现创建人已不在群里，会暂停这个定时任务，并私聊通知创建人。应用只有创建人能执行，所以别人不能直接接手；需要的话，管理员可以把这个应用重新分配给群里的另一个人，对方接收时可以选择以自己的身份重建这些定时任务（见下一问）。定时任务也不能「转给」别人，因为那等于把一个人的数据权限换成另一个人的。\n\n**注意有最长约 10 分钟的延迟**：Amber 判断「是否在群里」用的群成员名单会缓存 10 分钟，且不监听退群事件。所以创建人退群后的最多 10 分钟内，定时任务可能还会按他的身份（他的数据权限）照常跑一到两轮，结果照常发到群里；缓存过期后的下一轮才会暂停。退群前想让任务立刻停，请先把它**暂停**（暂停立即生效），不要让它处于运行状态时退群。\n\n**应用的创建人离职或退群了，应用怎么办？**\n应用不会自动下线，但只有创建人能执行，所以它会一直没人能用。管理员在网站上能看到这类应用（标「创建人已离群」），可以在页面底部的「重新分配」里把它交给群里的另一个人：Amber 私聊对方发一张确认卡，对方点「接收」后成为新的创建人。\n- 必须对方本人确认：接收后以他的身份和数据权限执行。\n- 原来的配置项和密钥都保留（多数是离职交接，凭证要接着用），新创建人可以在网站上修改。\n- 原来的定时任务，对方可以选「接收，并重建定时任务」（以他的身份，时间、参数不变），或者「只接收应用」（原定时任务删除）。\n- 只有创建人已不在群里的应用能重新分配；确认卡 7 天内有效，管理员重新发起时旧卡片作废。\n\n**能在群里登录网站吗？**\n能。在群里 @Amber 发「登录」，Amber 会把登录卡片发到你和 Amber 的私聊里，链接不会出现在群里。\n\n**管理员和审核人有什么区别？**\n审核人决定代码能不能上线，管理员负责上线之后的管理（全局/本地、下线任何应用、管理任何定时任务）。管理员不能跳过审核。详见上面的[创建人、管理员、审核人](#创建人管理员审核人)。\n\n**部署文档里有两处安装命令，按哪个？**\n它们装的不是同一个东西。[安装与部署](install.md) 是部署 Amber 服务端，一个组织只部署一套，已经有了就不用再装；[amber 命令行与 skill](cli-and-skill.md) 是在每台跑 agent 的机器上装客户端。只是想让自己的 agent 用上 Amber，看后者就够了。\n\n**应用要读本机的文件（比如机器人建的台账）怎么办？**\n应用自己不写路径，能访问什么由**运行环境**决定：在数据所在的机器上装一个执行端，登记一个运行环境（一个目录，或者直接从 botmux 导出某个机器人的访问权限），管理员批准后，应用写明在哪个环境里跑就行。在从机器人导出的环境里，脚本能访问的数据和这个机器人在自己沙箱里能访问的一样，用 lark-cli 时也是这个机器人的身份。不写环境的应用在 Amber 本机跑，不访问任何业务数据。详见[执行端](executor.md)，开头的「概念」一节讲了机器、执行端、运行环境、沙箱的关系。\n\n**有些参数每次都一样，能不能不用每次填？**\n用配置项。让 agent 在草稿里给这个参数加上 `\"scope\": \"config\"`，审核时审核人能看到哪些是配置项。应用生效后，创建人或管理员在网站上这个应用页面底部的「配置项」里设置值。\n- 执行时 Amber 把配置项的值和本次参数一起交给脚本；表单卡、网站执行页、agent 都不再要这些值，执行的人也改不了。\n- 必填的配置项没设置（又没有默认值）时，执行和创建定时任务都会被拒绝，提示去网站设置。\n- 改值不需要重新审核，下一次执行（包括定时任务）就用新值；增加或删除配置项需要提交新版本。\n- 试运行时还没有地方保存值，配置项在试运行表单里填（标「配置项」），只用于这次试运行，不会保存。\n- 应用下线时，它的配置项一起删除；同名的新版本审核通过后，沿用原来的值。\n- 配置项不保密，看得到这个应用的人都能看到值。token、密码要用密钥。\n\n**应用需要 token、密码怎么办？**\n让 agent 在草稿里声明需要哪些密钥（只写名字，比如 `API_TOKEN`），审核时审核人能看到这个应用用了哪些密钥。值由创建人或管理员私聊 Amber 发「设置密钥 应用名」填写，或在网站上填写；新应用在认领卡上点「设置密钥」，填好后再试运行。\n- 值加密保存在 Amber 里，不会出现在聊天记录里，agent 也拿不到；只交给声明了它的这个应用，别的应用拿不到。\n- 设置后只能覆盖或删除，不能再查看，界面上只显示末尾 4 位。改值不需要重新审核；增加或删除密钥的名字需要提交新版本。\n- 脚本如果把密钥原样打印出来，结果里会自动显示成 `***`。\n- 应用只有创建人能执行，所以密钥只有创建人自己在用。**全局应用例外**：所有执行人共用同一份密钥，看到的是这个凭证的权限范围，不是执行人本人的权限，结果卡上会标「使用全局应用共用的密钥」。\n- 需要密钥的应用，agent 不能直接执行，总要你本人在确认卡上点一下。\n- 能防的是其他应用、agent、群里其他人、其他进程读到明文；防不了的是审核时没看出来的恶意代码，所以审核时要留意代码怎么使用密钥。\n- 应用下线时，它的密钥一起删除；同名的新版本审核通过后，沿用原来的密钥。\n\n## 8. 进阶文档\n\n| 文档 | 读者 |\n|---|---|\n| [amber 命令行与 skill](cli-and-skill.md) | 给 agent 配置 Amber 的人 |\n| [可信身份](identity.md) | 后端服务方：怎么验证 Amber 签发的执行身份凭证 |\n| [可信身份：完整示例](identity-example.md) | 想让应用以执行人身份查数据的人：Python 服务 + 应用的完整流程 |\n| [安装与部署](install.md) | 部署 Amber 的人 |\n| [飞书应用配置](feishu-setup.md) | 配置飞书应用的管理员 |\n","nav":[{"name":"usage","title":"使用指南","current":true},{"name":"sharing","title":"应用的分享","current":false},{"name":"cli-and-skill","title":"amber 命令行与 skill","current":false},{"name":"executor","title":"执行端","current":false},{"name":"environment-format","title":"运行环境定义格式","current":false},{"name":"identity","title":"可信身份","current":false},{"name":"identity-example","title":"可信身份：完整示例","current":false},{"name":"install","title":"安装与部署","current":false},{"name":"feishu-setup","title":"飞书应用配置","current":false}]};
const REPO = 'https://github.com/xu4wang/amber/blob/main/';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Same anchor rule as GitHub, so links written for the repo keep working here.
const slug = t => t.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');

const doc = document.getElementById('doc');
doc.innerHTML = DOMPurify.sanitize(marked.parse(DATA.md));
const names = new Set(DATA.nav.map(n => n.name));
doc.querySelectorAll('a[href]').forEach(a => {
  const h = a.getAttribute('href');
  const m = /^([a-z-]+)\.md(#.*)?$/.exec(h);
  if (m && names.has(m[1])) a.setAttribute('href', m[1] + '.html' + (m[2] || ''));
  else if (/^\.\.\//.test(h)) { a.setAttribute('href', REPO + h.replace(/^\.\.\//, '')); a.target = '_blank'; a.rel = 'noopener'; }
  else if (/^https?:/.test(h)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
});
const toc = [];
doc.querySelectorAll('h2, h3').forEach(h => { h.id = slug(h.textContent); if (h.tagName === 'H2') toc.push(h); });
if (typeof hljs === 'object') doc.querySelectorAll('pre code').forEach(c => {
  const lang = (c.className.match(/language-(\w+)/) || [])[1];
  if (lang && hljs.getLanguage(lang)) hljs.highlightElement(c);
});

const cur = DATA.nav.find(n => n.current);
document.getElementById('nav').innerHTML =
  '<div class="group">使用</div>' + DATA.nav.slice(0, 2).map(n => link(n)).join('') +
  '<div class="group">进阶</div>' + DATA.nav.slice(2).map(n => link(n)).join('');
function link(n) {
  const a = `<a href="${esc(n.name)}.html" class="${n.current ? 'cur' : ''}">${esc(n.title)}</a>`;
  return n.current && toc.length ? a + '<div class="toc">' + toc.map(h => `<a href="#${esc(h.id)}">${esc(h.textContent)}</a>`).join('') + '</div>' : a;
}
